<script>
"use strict";

/* ==========================================================
   VOID AI KONFIGURATION
   Trage deine Supabase-Daten hier ein.
   Cloudflare Worker bleibt unverändert.
   ========================================================== */

const CONFIG = {
 SUPABASE_URL: "DEINE_SUPABASE_PROJECT_URL",
 SUPABASE_ANON_KEY: "DEIN_SUPABASE_ANON_PUBLIC_KEY",
 WORKER_URL: "https://void-ai-api.cguerpinar.workers.dev/",
 IMAGE_URL: "https://image.pollinations.ai/prompt/",
 MAX_CHATS: 40
};

/* Supabase: Einstellungen > API / Connect */
const supabaseConfigured =
 CONFIG.SUPABASE_URL.startsWith("https://") &&
 !CONFIG.SUPABASE_URL.includes("DEINE_") &&
 !CONFIG.SUPABASE_ANON_KEY.includes("DEIN_");

let supabase = null;
if (supabaseConfigured && window.supabase) {
 supabase = window.supabase.createClient(
  CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY
 );
}

const $ = id => document.getElementById(id);
const auth = $("auth"), app = $("app"), messages = $("messages");
const promptBox = $("prompt");
const state = {
 user: null, chats: [], currentId: null, busy: false,
 mode: "chat", lastAnswer: "", recognition: null
};

function makeId() {
 return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function escapeHTML(value) {
 return String(value).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function notify(text) {
 const n = $("notice");
 n.textContent = text;
 n.classList.remove("hidden");
 clearTimeout(notify.timer);
 notify.timer = setTimeout(() => n.classList.add("hidden"), 4000);
}
function setAuthStatus(text) { $("authStatus").textContent = text; }

function setAuthMode(mode) {
 const registering = mode === "register";
 $("name").classList.toggle("hidden", !registering);
 $("nameLabel").classList.toggle("hidden", !registering);
 $("confirmWrap").classList.toggle("hidden", !registering);
 $("confirmPassword").required = registering;
 $("name").required = registering;
 $("loginTab").classList.toggle("active", !registering);
 $("registerTab").classList.toggle("active", registering);
 $("authSubmit").textContent = registering ? "Konto erstellen" : "Anmelden";
 $("password").autocomplete = registering ? "new-password" : "current-password";
 setAuthStatus("");
}
$("loginTab").onclick = () => setAuthMode("login");
$("registerTab").onclick = () => setAuthMode("register");

function showApp(user) {
 state.user = user;
 auth.classList.add("hidden");
 app.classList.remove("hidden");
 $("accountEmail").textContent = user.email || "Angemeldet";
 loadChats();
}
function showAuth() {
 app.classList.add("hidden");
 auth.classList.remove("hidden");
 state.user = null;
}

$("authForm").addEventListener("submit", async event => {
 event.preventDefault();
 if (!supabase) {
  setAuthStatus("Supabase fehlt noch. Trage Projekt-URL und anon/public key im CONFIG-Block ein.");
  return;
 }
 const mode = $("registerTab").classList.contains("active")
  ? "register" : "login";
 const email = $("email").value.trim();
 const password = $("password").value;
 const button = $("authSubmit");
 button.disabled = true;
 setAuthStatus("Einen Moment…");
 try {
  if (mode === "register") {
   if (password !== $("confirmPassword").value) {
    throw new Error("Die Passwörter stimmen nicht überein.");
   }
   if (password.length < 8) throw new Error("Nutze mindestens 8 Zeichen.");
   const {data,error} = await supabase.auth.signUp({
    email,password,
    options:{data:{display_name:$("name").value.trim()}}
   });
   if (error) throw error;
   if (data.session) {
    showApp(data.user);
   } else {
    setAuthStatus("Registrierung gesendet. Falls E-Mail-Bestätigung aktiviert ist, bestätige zuerst deine E-Mail. Du kannst das in Supabase unter Authentication > Sign In / Providers konfigurieren.");
   }
  } else {
   const {data,error} = await supabase.auth.signInWithPassword({email,password});
   if (error) throw error;
   showApp(data.user);
  }
 } catch(error) {
  setAuthStatus(error.message || "Anmeldung fehlgeschlagen.");
 } finally { button.disabled = false; }
});

$("logout").onclick = async () => {
 if (supabase) await supabase.auth.signOut();
 state.chats = [];
 state.currentId = null;
 showAuth();
};

async function init() {
 if (!supabase) {
  setAuthStatus("Einrichtung erforderlich: Supabase URL und anon/public key eintragen.");
  return;
 }
 try {
  const {data:{session}} = await supabase.auth.getSession();
  if (session) showApp(session.user);
  supabase.auth.onAuthStateChange((event,session) => {
   if (event === "SIGNED_IN" && session) showApp(session.user);
   if (event === "SIGNED_OUT") showAuth();
  });
 } catch(e) { setAuthStatus("Supabase-Verbindung fehlgeschlagen: " + e.message); }
}
function storageKey() {
 return "voidai_chats_" + (state.user ? state.user.id : "guest");
}
function loadChats() {
 try {
  const raw = localStorage.getItem(storageKey());
  state.chats = raw ? JSON.parse(raw) : [];
  if (!Array.isArray(state.chats)) state.chats = [];
 } catch(e) { state.chats = []; }
 if (!state.chats.length) createChat(false);
 else openChat(state.chats[0].id);
 renderChatList();
}
function saveChats() {
 try {
  state.chats = state.chats.slice(0,CONFIG.MAX_CHATS);
  localStorage.setItem(storageKey(), JSON.stringify(state.chats));
 } catch(e) { notify("Speicher voll. Lösche alte Chats."); }
 renderChatList();
}
function currentChat() {
 return state.chats.find(c => c.id === state.currentId);
}
function createChat(save=true) {
 const chat = {id:makeId(),title:"Neuer Chat",messages:[],updated:Date.now()};
 state.chats.unshift(chat);
 state.currentId = chat.id;
 if (save) saveChats();
 renderMessages();
 $("topTitle").textContent = chat.title;
 closeSidebar();
}
function openChat(id) {
 const chat = state.chats.find(c => c.id === id);
 if (!chat) return;
 state.currentId = id;
 $("topTitle").textContent = chat.title;
 renderMessages();
 renderChatList();
 closeSidebar();
}
function deleteChat(id) {
 state.chats = state.chats.filter(c => c.id !== id);
 if (!state.chats.length) createChat(false);
 else if (state.currentId === id) state.currentId = state.chats[0].id;
 saveChats();
 openChat(state.currentId);
}
function renderChatList() {
 const list = $("chatList");
 list.replaceChildren();
 state.chats.forEach(chat => {
  const row = document.createElement("div");
  row.className = "chat-entry";
  const open = document.createElement("button");
  open.className = "side-button" + (chat.id === state.currentId ? " active" : "");
  open.textContent = chat.title;
  open.onclick = () => openChat(chat.id);
  const del = document.createElement("button");
  del.className = "secondary delete";
  del.textContent = "×";
  del.title = "Chat löschen";
  del.onclick = () => {
   if (confirm("Diesen Chat löschen?")) deleteChat(chat.id);
  };
  row.append(open,del);
  list.append(row);
 });
}
function renderMessages() {
 messages.replaceChildren();
 const chat = currentChat();
 if (!chat || !chat.messages.length) {
  messages.append($("welcome"));
  $("welcome").classList.remove("hidden");
  return;
 }
 $("welcome").classList.add("hidden");
 chat.messages.forEach(m => addMessageElement(m.role,m.content,false));
 messages.scrollTop = messages.scrollHeight;
}
function formatText(text) {
 /* Safe lightweight Markdown: code, bold and line breaks. */
 let s = escapeHTML(text);
 const blocks = [];
 s = s.replace(/```([\w-]*)\n?([\s\S]*?)```/g,(_,lang,code) => {
  const i=blocks.length;
  blocks.push('<pre><code>'+code+'</code></pre>');
  return '\u0000BLOCK'+i+'\u0000';
 });
 s = s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
 s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
 s = s.replace(/\n/g,"<br>");
 s = s.replace(/\u0000BLOCK(\d+)\u0000/g,(_,i)=>blocks[Number(i)]);
 return s;
}
function addMessageElement(role,content,scroll=true) {
 $("welcome").classList.add("hidden");
 const wrap = document.createElement("div");
 wrap.className = "message";
 const avatar = document.createElement("div");
 avatar.className = "avatar";
 avatar.textContent = role === "user" ? "DU" : "V";
 const body = document.createElement("div");
 body.className = "message-body";
 const text = document.createElement("div");
 text.innerHTML = formatText(content);
 body.append(text);
 if (role !== "user") {
  const tools = document.createElement("div");
  tools.className = "message-tools";
  const copy = document.createElement("button");
  copy.textContent = "Kopieren";
  copy.onclick = async () => {
   try { await navigator.clipboard.writeText(content); notify("Antwort kopiert"); }
   catch(e) { notify("Kopieren nicht möglich"); }
  };
  const speak = document.createElement("button");
  speak.textContent = "Vorlesen";
  speak.onclick = () => speakText(content);
  tools.append(copy,speak);
  body.append(tools);
 }
 wrap.append(avatar,body);
 messages.append(wrap);
 if (scroll) messages.scrollTop = messages.scrollHeight;
 return wrap;
}
function addMessage(role,content) {
 const chat = currentChat();
 if (!chat) return;
 chat.messages.push({role,content});
 if (chat.messages.length === 1 && role === "user") {
  chat.title = content.slice(0,38) || "Neuer Chat";
  $("topTitle").textContent = chat.title;
 }
 chat.updated = Date.now();
 saveChats();
 addMessageElement(role,content);
}
function closeSidebar() { $("sidebar").classList.remove("open"); }
$("mobileMenu").onclick = () => $("sidebar").classList.toggle("open");
$("closeMenu").onclick = closeSidebar;
$("newChat").onclick = () => createChat();
document.querySelectorAll(".suggestion").forEach(b => {
 b.onclick = () => { promptBox.value = b.dataset.prompt; sendMessage(); };
});

function extractAnswer(data) {
 if (typeof data === "string") return data;
 if (!data || typeof data !== "object") return "";
 const candidates = [
  data.answer,data.response,data.reply,data.message,data.output,
  data.text,data.content,data.result,
  data.choices?.[0]?.message?.content,
  data.choices?.[0]?.text,
  data.data?.answer,data.data?.response,data.data?.text,
  data.result?.response,data.result?.text
 ];
 return candidates.find(v => typeof v === "string" && v.trim()) || "";
}
async function callWorker(userText,chatMessages) {
 const history = chatMessages.slice(-20).map(m => ({
  role:m.role,content:m.content
 }));
 const payload = {
  message:userText,
  prompt:userText,
  history,
  messages:history,
  model:"default"
 };
 const controller = new AbortController();
 const timer = setTimeout(() => controller.abort(),45000);
 try {
  const response = await fetch(CONFIG.WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload),
   signal:controller.signal
  });
  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw); } catch(e) { data = raw; }
  if (!response.ok) {
   const reason = typeof data === "object"
    ? data.error || data.message : data;
   throw new Error("Worker Fehler " + response.status + ": " +
    String(reason || "Unbekannter Fehler").slice(0,300));
  }
  if (data && typeof data === "object" && data.error) {
   throw new Error(String(data.error));
  }
  const answer = extractAnswer(data);
  if (!answer) {
   throw new Error("Die KI hat keine Antwort geliefert. Der Worker erwartet möglicherweise ein anderes Nachrichtenformat.");
  }
  return answer;
 } finally { clearTimeout(timer); }
}
async function sendMessage() {
 if (state.busy) return;
 const text = promptBox.value.trim();
 if (!text) return;
 if (!state.user) { notify("Melde dich zuerst an."); return; }
 if (!currentChat()) createChat(false);
 promptBox.value = "";
 promptBox.style.height = "auto";
 addMessage("user",text);
 state.busy = true;
 $("send").disabled = true;
 $("send").textContent = "…";
 const pending = addMessageElement("assistant","Void AI denkt nach…");
 try {
  const chat = currentChat();
  const answer = await callWorker(text,chat.messages.slice(0,-1));
  pending.remove();
  addMessage("assistant",answer);
  state.lastAnswer = answer;
 } catch(error) {
  pending.remove();
  const message = error.name === "AbortError"
   ? "Die Anfrage dauert zu lange. Versuch es nochmal."
   : "Antwort konnte nicht geladen werden: " + error.message;
  addMessage("assistant",message);
 } finally {
  state.busy = false;
  $("send").disabled = false;
  $("send").textContent = "Senden ↑";
  promptBox.focus();
 }
}
$("send").onclick = sendMessage;
promptBox.addEventListener("keydown",event => {
 if (event.key === "Enter" && !event.shiftKey) {
  event.preventDefault(); sendMessage();
 }
});
promptBox.addEventListener("input",() => {
 promptBox.style.height = "auto";

 }

  state.recognition.stop(); state.recognition = null;
  $("mic").textContent = "Mikrofon"; return;
 }
 const rec = new SpeechRecognition();
 state.recognition = rec;
 rec.lang = "de-DE";
 rec.interimResults = true;
 rec.continuous = false;
 $("mic").textContent = "Höre zu…";

function speakText(text) {
