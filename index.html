
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090611">
<title>Void AI</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090611;
  --panel:#120d1d;
  --panel2:#1b1229;
  --purple:#a855f7;
  --violet:#7c3aed;
  --text:#ffffff;
  --muted:#b4a8c5;
  --border:#ffffff18;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg)}
body{
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button,textarea{font:inherit}
button{color:inherit;touch-action:manipulation}
button:focus-visible,textarea:focus-visible{
  outline:2px solid #c084fc;outline-offset:2px
}

/* Hintergrund */
.background{
  position:fixed;inset:0;overflow:hidden;pointer-events:none;
  z-index:0;background:
  radial-gradient(ellipse at 50% 0%,#42145e55,transparent 55%),
  #090611;
}
.glow{
  position:absolute;width:300px;height:300px;border-radius:50%;
  filter:blur(90px);opacity:.22;
  animation:float 16s ease-in-out infinite alternate;
}
.glow.a{background:#9333ea;top:-100px;left:-140px}
.glow.b{background:#6d28d9;bottom:-160px;right:-120px;animation-delay:-7s}
@keyframes float{
  from{transform:translate(0,0)}
  to{transform:translate(80px,50px)}
}

/* Layout */
.app{
  position:relative;z-index:1;
  display:flex;width:100%;height:100vh;height:100dvh;
  overflow:hidden;
}
.sidebar{
  width:260px;flex:0 0 260px;
  display:flex;flex-direction:column;gap:18px;
  padding:18px;background:#0d0916;
  border-right:1px solid var(--border);
  min-height:0;
}
.brand{display:flex;align-items:center;gap:12px}
.brandname{font-size:21px;font-weight:800;letter-spacing:-.5px}
.brandname span{color:#c084fc}
.tagline{font-size:12px;color:var(--muted);margin-top:3px}
.newchat{
  padding:13px;border-radius:13px;
  background:#8b35d51b;border:1px solid #a855f755;
  text-align:left;font-weight:650
}
.newchat:active,.iconbtn:active{background:#a855f733}
.label{
  font-size:11px;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--muted);margin:0 0 9px
}
.chatlist{
  display:flex;flex-direction:column;gap:5px;
  overflow:auto;min-height:0
}
.chatrow{display:flex;align-items:center;gap:5px}
.chatopen{
  flex:1;min-width:0;text-align:left;padding:10px;
  border:1px solid transparent;border-radius:10px;
  background:transparent;color:#e9ddf6;overflow:hidden
}
.chatopen.active{background:#a855f720;border-color:#a855f733}
.chatname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.del{
  border:0;background:transparent;color:var(--muted);
  padding:7px;border-radius:8px
}
.del:hover{color:#ff9db7}
.sidebottom{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.7}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{
  flex-shrink:0;min-height:66px;padding:10px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--border);background:#0b0712dd;
}
.topgroup{display:flex;align-items:center;gap:11px}
.topname{font-weight:750}
.status{font-size:12px;color:#c4a5fd;margin-top:3px}
.iconbtn{
  min-width:40px;min-height:40px;padding:7px 10px;
  border:1px solid var(--border);border-radius:12px;
  background:#ffffff08;display:inline-flex;align-items:center;justify-content:center;
}
.mobileonly{display:none}
.workspace{
  flex:1;min-height:0;min-width:0;width:100%;
  max-width:920px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:20px 24px 12px;
}
.messages{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:20px;
  padding:6px 3px 24px;
  scrollbar-color:#53366c transparent;
}
.welcome{margin:auto 0;text-align:center;padding:22px 0 30px}
.sphere{
  width:92px;height:92px;margin:0 auto 23px;position:relative;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 24%,#fff 0%,#f0d9ff 4%,transparent 16%),
    radial-gradient(circle at 32% 28%,#e9c8ff 0%,#b66aff 18%,#7728d3 43%,#32105d 72%,#10051f 100%);
  box-shadow:inset -12px -15px 26px #09020f99,
    inset 5px 5px 18px #ffffff7a,
    0 0 25px #a855f780,0 0 70px #7e22ce55;
  animation:sphereFloat 4s ease-in-out infinite;
}
.sphere:before{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  border:1px solid #c084fc66;
  box-shadow:0 0 18px #9333ea35;
  animation:rotateRing 10s linear infinite;
}
.sphere:after{
  content:"";position:absolute;left:16%;top:12%;
  width:30%;height:13%;border-radius:50%;
  background:#fff9;filter:blur(7px);transform:rotate(-35deg)
}
@keyframes sphereFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
@keyframes rotateRing{to{transform:rotate(360deg)}}
h1{font-size:clamp(29px,5vw,43px);letter-spacing:-1.5px;margin:0 0 12px}
.gradient{
  background:linear-gradient(90deg,#f5e8ff,#c084fc,#a78bfa);
  color:transparent;background-clip:text;-webkit-background-clip:text
}
.welcome p{
  color:var(--muted);font-size:14px;line-height:1.7;
  max-width:440px;margin:0 auto 25px
}
.suggestions{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;max-width:580px;margin:auto
}
.suggestion{
  padding:13px;text-align:left;min-width:0;
  border-radius:14px;border:1px solid var(--border);
  background:#ffffff06;line-height:1.5;font-size:12px
}
.suggestion strong{display:block;font-size:13px;margin-bottom:3px}
.suggestion span{color:var(--muted)}
.suggestion:hover{background:#a855f719;border-color:#a855f744}

/* Nachrichten */
.msg{display:flex;align-items:flex-start;gap:10px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.avatar{
  width:32px;height:32px;flex:0 0 32px;border-radius:11px;
  display:grid;place-items:center;
  color:#f3e8ff;background:#7127ac
}
.user .avatar{background:#342140}
.msgbody{min-width:0;max-width:calc(100% - 42px)}
.user .msgbody{display:flex;flex-direction:column;align-items:flex-end}
.bubble{
  min-width:0;max-width:100%;overflow-wrap:anywhere;
  white-space:pre-wrap;line-height:1.75;font-size:14px;
  padding:12px 15px;border:1px solid var(--border);
  border-radius:4px 16px 16px 16px;background:#171020
}
.user .bubble{background:#54248a4d;border-color:#a855f733;border-radius:16px 4px 16px 16px}
.bubble pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;overflow:auto}
.actions{display:flex;gap:5px;margin-top:5px}
.action{
  border:0;background:transparent;color:var(--muted);
  font-size:12px;padding:6px 8px;border-radius:7px
}
.action:hover{background:#ffffff0b;color:white}
.typing{font-size:13px;color:var(--muted);padding:12px}
.dots span{display:inline-block;animation:pulse 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{50%{opacity:.2}}

/* Eingabefeld: sichtbarer Text und Cursor */
.composerarea{
  flex-shrink:0;width:100%;padding-top:8px;
  background:linear-gradient(transparent,#090611 18%);
}
.composer{
  width:100%;display:flex;align-items:flex-end;gap:7px;
  padding:9px;border:1px solid #a855f755;border-radius:18px;
  background:#130d20;box-shadow:0 8px 35px #0005;
}
#prompt{
  display:block;flex:1;min-width:0;width:100%;
  min-height:44px;max-height:130px;resize:none;
  margin:0;padding:12px 7px;border:0!important;border-radius:8px;
  outline:none!important;box-shadow:none!important;
  background:transparent!important;
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
  caret-color:#d8b4fe!important;
  opacity:1!important;
  font-family:inherit;font-size:16px;line-height:1.4;
  pointer-events:auto;user-select:text;-webkit-user-select:text;
  appearance:none;-webkit-appearance:none;
}
#prompt::placeholder{
  color:#b4a8c5!important;-webkit-text-fill-color:#b4a8c5!important;
  opacity:1
}
#prompt:disabled{opacity:1!important}
.send{
  width:44px;height:44px;flex:0 0 44px;
  border:0;border-radius:13px;
  background:linear-gradient(135deg,#c084fc,#7c3aed);
  color:white;font-size:20px;font-weight:800
}
.send:disabled{opacity:.5}
.hint{text-align:center;color:#81768f;font-size:10px;padding:9px 3px 0}
.hidden{display:none!important}
.overlay{display:none}

/* Handy und geöffnete Tastatur */
@media(max-width:700px){
  .sidebar{
    position:fixed;z-index:20;left:0;top:0;bottom:0;
    height:100%;height:100dvh;
    transform:translateX(-105%);transition:transform .2s;
    box-shadow:15px 0 45px #0008
  }
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block;position:fixed;z-index:19;inset:0;background:#0009}
  .mobileonly{display:inline-flex}
  .topbar{min-height:58px;padding:8px 12px}
  .workspace{padding:10px 10px 7px}
  .messages{gap:15px;padding-bottom:12px}
  .welcome{padding:13px 0 20px}
  .sphere{width:70px;height:70px;margin-bottom:19px}
  h1{font-size:30px}
  .welcome p{font-size:13px;margin-bottom:19px}
  .suggestions{gap:7px}
  .suggestion{padding:10px;font-size:11px}
  .suggestion strong{font-size:12px}
  .bubble{font-size:14px;padding:10px 12px}
  .composerarea{padding-top:5px}
  .composer{gap:4px;padding:6px;border-radius:15px}
  #prompt{min-height:44px;padding:12px 5px;font-size:16px}
  .send{width:42px;height:42px;flex-basis:42px}
  .iconbtn{min-width:38px;min-height:38px}
  .hint{font-size:9px;padding-top:6px}
}
@media(max-height:540px){
  .sphere{width:52px;height:52px;margin-bottom:12px}
  .welcome{padding:5px 0}
  .welcome p{margin-bottom:12px}
  .suggestion{padding:7px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="background" aria-hidden="true">
  <div class="glow a"></div><div class="glow b"></div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="sphere" style="width:42px;height:42px;flex:0 0 42px;margin:0;animation:none"></div>
      <div>
        <div class="brandname">Void <span>AI</span></div>
        <div class="tagline">Deine KI. Dein Universum.</div>
      </div>
    </div>

    <button class="newchat" id="newChat">＋ &nbsp; Neuer Chat</button>
    <div style="min-height:0;display:flex;flex-direction:column;flex:1">
      <p class="label">Deine Chats</p>
      <div class="chatlist" id="chatList"></div>
    </div>
    <div class="sidebottom">
      <div>✦ Void AI 2.0</div>
      <div>Chats werden auf diesem Gerät gespeichert.</div>
      <div>KI-Antworten können Fehler enthalten.</div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div class="topgroup">
        <button class="iconbtn mobileonly" id="menuBtn" aria-label="Menü">☰</button>
        <div>
          <div class="topname">Void AI <span class="gradient">✦</span></div>
          <div class="status" id="status">Bereit für deine Fragen</div>
        </div>
      </div>
      <button class="iconbtn" id="clearBtn" title="Neuer Chat" aria-label="Neuer Chat">＋</button>
    </header>

    <section class="workspace">
      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="composerarea">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" maxlength="6000"
            placeholder="Frag Void AI etwas..." aria-label="Nachricht schreiben"
            enterkeyhint="send"></textarea>
          <button type="button" class="iconbtn" id="voiceBtn"
            title="Spracheingabe" aria-label="Spracheingabe">🎙</button>
          <button type="submit" class="send" id="sendBtn" aria-label="Senden">➤</button>
        </form>
        <div class="hint">Enter zum Senden · Shift + Enter für neue Zeile</div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";

const API_URL = "https://void-ai-api.cguerpinar.workers.dev/";
const STORAGE_KEY = "void_ai_2_chats";
const ACTIVE_KEY = "void_ai_2_active";
const $ = id => document.getElementById(id);

let chats = [];
let activeId = null;
let busy = false;
let recognition = null;

function makeId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function newChatObject(){
  return {id:makeId(),title:"Neuer Chat",messages:[],updated:Date.now()};
}
function currentChat(){return chats.find(c=>c.id===activeId)}
function setStatus(text){$("status").textContent=text}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(chats.slice(0,60)));
    localStorage.setItem(ACTIVE_KEY,activeId||"");
  }catch(e){
    setStatus("Chats konnten nicht gespeichert werden");
  }
}
function load(){
  try{
    const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    if(Array.isArray(parsed)){
      chats=parsed.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages)).slice(0,60);
    }
    activeId=localStorage.getItem(ACTIVE_KEY);
  }catch(e){chats=[];activeId=null}
  if(!currentChat()){
    if(chats.length)activeId=chats[0].id;
    else{
      const c=newChatObject();chats.unshift(c);activeId=c.id;
    }
  }
  renderAll();
}
function createChat(){
  if(busy)return;
  const c=newChatObject();
  chats.unshift(c);activeId=c.id;
  save();renderAll();closeMenu();
  $("prompt").focus();
}
function addMessage(role,content){
  const c=currentChat();if(!c)return;
  c.messages.push({role,content});
  c.updated=Date.now();
  if(role==="user"&&(c.title==="Neuer Chat"||!c.title)){
    c.title=content.trim().slice(0,34)||"Neuer Chat";
  }
  save();
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function formatText(text){
  let s=escapeHTML(text);
  s=s.replace(/```([\s\S]*?)```/g,
    (_,code)=>'<pre style="background:#090611;padding:12px;border-radius:9px"><code>'+code.trim()+'</code></pre>');
  s=s.replace(/`([^`\n]+)`/g,
    "<code style='background:#090611;padding:2px 5px;border-radius:4px'>$1</code>");
  s=s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
  return s;
}
function welcomeHTML(){
  return `<div class="welcome">
    <div class="sphere"></div>
    <h1>Willkommen bei <span class="gradient">Void AI</span></h1>
    <p>Dein Raum für Ideen, Wissen und Kreativität. Was möchtest du heute entdecken?</p>
    <div class="suggestions">
      <button class="suggestion" data-prompt="Erkläre mir ein schwieriges Thema einfach."><strong>✧ Einfach erklärt</strong><span>Schwieriges verständlich machen</span></button>
      <button class="suggestion" data-prompt="Hilf mir, eine coole Idee zu entwickeln."><strong>✧ Neue Ideen</strong><span>Kreativ denken und planen</span></button>
      <button class="suggestion" data-prompt="Hilf mir beim Programmieren und erkläre den Code."><strong>⌘ Programmieren</strong><span>Code erstellen und verstehen</span></button>
      <button class="suggestion" data-prompt="Erzähl mir interessante Fakten über das Universum."><strong>✦ Wissen entdecken</strong><span>Neue Dinge lernen</span></button>
    </div>
  </div>`;
}
function renderMessages(){
  const box=$("messages");
  const c=currentChat();
  box.innerHTML="";
  if(!c||!c.messages.length){
    box.innerHTML=welcomeHTML();
    box.querySelectorAll("[data-prompt]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        $("prompt").value=btn.dataset.prompt;
        resizeInput();sendMessage();
      });
    });
    return;
  }
  c.messages.forEach(m=>{
    const row=document.createElement("div");
    row.className="msg "+(m.role==="user"?"user":"assistant");
    const avatar=document.createElement("div");
    avatar.className="avatar";
    avatar.textContent=m.role==="user"?"●":"✦";
    const body=document.createElement("div");
    body.className="msgbody";
    const bubble=document.createElement("div");
    bubble.className="bubble";
    bubble.innerHTML=formatText(m.content||"");
    body.appendChild(bubble);

    if(m.role==="assistant"){
      const actions=document.createElement("div");
      actions.className="actions";
      const copy=document.createElement("button");
      copy.className="action";copy.textContent="▢ Kopieren";
      copy.addEventListener("click",async()=>{
        try{
          if(navigator.clipboard&&navigator.clipboard.writeText){
            await navigator.clipboard.writeText(m.content);
          }else{
            const temp=document.createElement("textarea");
            temp.value=m.content;document.body.appendChild(temp);
            temp.select();document.execCommand("copy");temp.remove();
          }
          copy.textContent="✓ Kopiert";
          setTimeout(()=>copy.textContent="▢ Kopieren",1300);
        }catch(e){setStatus("Kopieren nicht möglich")}
      });
      const speak=document.createElement("button");
      speak.className="action";speak.textContent="🔊 Vorlesen";
      speak.addEventListener("click",()=>{
        if(!window.speechSynthesis){setStatus("Vorlesen nicht unterstützt");return}
        speechSynthesis.cancel();
        const utterance=new SpeechSynthesisUtterance(m.content);
        utterance.lang="de-DE";speechSynthesis.speak(utterance);
      });
      actions.append(copy,speak);body.appendChild(actions);
    }
    row.append(avatar,body);box.appendChild(row);
  });
  box.scrollTop=box.scrollHeight;
}
function renderChatList(){
  const list=$("chatList");list.innerHTML="";
  chats.forEach(c=>{
    const row=document.createElement("div");row.className="chatrow";
    const open=document.createElement("button");
    open.className="chatopen"+(c.id===activeId?" active":"");
    const name=document.createElement("span");
    name.className="chatname";name.textContent=c.title||"Neuer Chat";
    open.appendChild(name);
    open.addEventListener("click",()=>{
      if(busy)return;
      activeId=c.id;save();renderAll();closeMenu();
    });
    const del=document.createElement("button");
    del.className="del";del.textContent="×";del.title="Chat löschen";
    del.setAttribute("aria-label","Chat löschen");
    del.addEventListener("click",()=>{
      if(busy)return;
      chats=chats.filter(x=>x.id!==c.id);
      if(activeId===c.id)activeId=chats[0]?.id||null;
      if(!activeId){
        const fresh=newChatObject();chats.unshift(fresh);activeId=fresh.id;
      }
      save();renderAll();
    });
    row.append(open,del);list.appendChild(row);
  });
}
function renderAll(){renderChatList();renderMessages()}
function closeMenu(){
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
}
function resizeInput(){
  const el=$("prompt");
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,130)+"px";
}
function showTyping(){
  const el=document.createElement("div");
  el.id="typing";el.className="typing";
  el.innerHTML='Void AI denkt nach <span class="dots"><span>●</span> <span>●</span> <span>●</span></span>';
  $("messages").appendChild(el);
  $("messages").scrollTop=$("messages").scrollHeight;
}
async function sendMessage(){
  if(busy)return;
  const input=$("prompt");
  const text=input.value.trim();
  if(!text)return;
  if(!currentChat()){
    const c=newChatObject();chats.unshift(c);activeId=c.id;
  }
  addMessage("user",text);
  input.value="";resizeInput();
  busy=true;
  $("sendBtn").disabled=true;
  $("voiceBtn").disabled=true;
  setStatus("Void AI denkt nach...");
  renderAll();showTyping();

  try{
    const c=currentChat();
    const history=c.messages.slice(-11,-1).map(m=>
      (m.role==="user"?"Nutzer":"Void AI")+": "+m.content
    ).join("\n\n");
    const message=
      "Du bist Void AI, ein hilfreicher Assistent. Antworte in der Sprache des Nutzers. "+
      "Antworte klar und direkt, normalerweise kurz, aber mit allen wichtigen Informationen. "+
      "Erkläre schwierige Themen einfach und Schritt für Schritt. Erfinde keine Fakten. "+
      (history?"\nBisheriger Chat:\n"+history:"")+
      "\n\nAktuelle Frage:\n"+text;

    const response=await fetch(API_URL,{
      method:"POST",
