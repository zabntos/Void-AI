
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090611">
<title>Void AI</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;height:100dvh;overflow:hidden;color:#f7f3ff;
 font-family:Inter,Arial,sans-serif;
 background:#080610;
 display:flex;flex-direction:column;position:relative
}
body:before,body:after{
 content:"";position:fixed;inset:auto;z-index:-1;
 width:70vw;height:70vw;border-radius:50%;
 filter:blur(90px);opacity:.4;pointer-events:none;
 animation:float 14s ease-in-out infinite alternate
}
body:before{background:#7017d8;top:-25vw;left:-20vw}
body:after{background:#2524a8;right:-25vw;bottom:-35vw;animation-delay:-7s}
@keyframes float{
 from{transform:translate(0,0) scale(1)}
 to{transform:translate(20vw,12vh) scale(1.3)}
}
header{
 height:70px;flex-shrink:0;padding:0 18px;
 display:flex;align-items:center;gap:12px;
 background:#0b0814bb;backdrop-filter:blur(18px);
 border-bottom:1px solid #ffffff12
}
.logo{
 width:40px;height:40px;border-radius:14px;
 display:grid;place-items:center;font-size:22px;
 background:linear-gradient(135deg,#a855f7,#5b21b6);
 box-shadow:0 0 24px #9333ea55
}
.brand{font-size:19px;font-weight:800;letter-spacing:.3px}
.brand span{color:#c084fc}
.status{font-size:11px;color:#b9a8cb;margin-top:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:5px}
#new{
 margin-left:auto;background:#ffffff0c;color:#ddd0ef;
 border:1px solid #ffffff18;border-radius:12px;padding:10px 13px;
 cursor:pointer
}
#chat{
 flex:1;overflow-y:auto;padding:22px 15px;
 display:flex;flex-direction:column;gap:15px;
 scroll-behavior:smooth
}
.welcome{text-align:center;margin:auto 0 10px;padding:15px 8px}
.orb{
 width:72px;height:72px;margin:0 auto 20px;border-radius:25px;
 display:grid;place-items:center;font-size:35px;
 background:linear-gradient(135deg,#a855f7,#4c1d95);
 box-shadow:0 0 55px #9333ea55;
 animation:pulse 3s infinite
}
@keyframes pulse{50%{box-shadow:0 0 75px #9333ea88;transform:translateY(-3px)}}
.welcome h1{font-size:clamp(25px,6vw,35px);margin:0 0 10px}
.welcome h1 span{color:#c084fc}
.welcome p{color:#b7a9c9;line-height:1.6;font-size:14px;margin:0 auto;max-width:300px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.suggestion{
 color:#e9ddfa;background:#ffffff09;border:1px solid #ffffff1a;
 border-radius:20px;padding:10px 13px;font-size:12px;cursor:pointer
}
.suggestion:active{background:#9333ea55}
.msg{
 max-width:min(88%,650px);padding:13px 15px;border-radius:17px;
 line-height:1.55;font-size:14px;overflow-wrap:anywhere;
 white-space:pre-wrap;animation:appear .2s ease
}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.user{align-self:flex-end;background:linear-gradient(135deg,#792be0,#5521a2);border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:#171020eF;border:1px solid #ffffff12;border-bottom-left-radius:5px}
.ai strong{color:#d8b4fe}
.thinking{color:#c4a4e9}
footer{padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#0b0814cc;backdrop-filter:blur(18px);border-top:1px solid #ffffff12}
.composer{
 display:flex;gap:9px;align-items:center;max-width:760px;margin:auto;
 padding:6px 6px 6px 14px;border-radius:18px;
 background:#ffffff0b;border:1px solid #ffffff20;
 transition:border-color .2s
}
.composer:focus-within{border-color:#a855f7aa;box-shadow:0 0 22px #9333ea19}
input{
 flex:1;min-width:0;background:transparent;border:0;outline:0;
 color:white;font-size:15px;padding:10px 0
}
input::placeholder{color:#887c99}
#send{
 width:43px;height:43px;border:0;border-radius:13px;
 color:white;background:linear-gradient(135deg,#a855f7,#6d28d9);
 font-size:20px;cursor:pointer;flex-shrink:0
}
#send:disabled{opacity:.45;cursor:default}
.note{text-align:center;font-size:10px;color:#82738f;margin-top:9px}
@media(min-width:700px){#chat{padding:28px 8%}footer{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<header>
 <div class="logo">✦</div>
 <div>
  <div class="brand">Void <span>AI</span></div>
  <div class="status"><span class="dot"></span>Bereit für deine Fragen</div>
 </div>
 <button id="new" title="Neuer Chat">＋ Neu</button>
</header>

<main id="chat">
 <section class="welcome" id="welcome">
  <div class="orb">✦</div>
  <h1>Hey, <span>was geht?</span></h1>
  <p>Frag einfach drauflos. Klare Antworten, echte Inhalte – ohne unnötiges Gerede.</p>
  <div class="suggestions">
   <button class="suggestion">Erklär mir etwas Neues</button>
   <button class="suggestion">Hilf mir beim Programmieren</button>
   <button class="suggestion">Gib mir kreative Ideen</button>
  </div>
 </section>
</main>

<footer>
 <div class="composer">
  <input id="message" maxlength="8000" placeholder="Frag Void AI etwas..." autocomplete="off">
  <button id="send" aria-label="Nachricht senden">➤</button>
 </div>
 <div class="note">Void AI kann Fehler machen – prüfe wichtige Informationen.</div>
</footer>

<script>
const API_URL="https://void-ai-api.cguerpinar.workers.dev/";
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const send=document.getElementById("send");
const welcome=document.getElementById("welcome");
let busy=false;

function addMessage(text,type){
 const el=document.createElement("div");
 el.className="msg "+type;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
 return el;
}

async function ask(text){
 text=text.trim();
 if(!text||busy)return;
 busy=true;
 welcome?.remove();
 addMessage(text,"user");
 input.value="";
 send.disabled=true;
 input.disabled=true;
 const loading=addMessage("Void AI denkt nach…","ai thinking");
 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:"Antworte auf Deutsch, außer der Nutzer schreibt in einer anderen Sprache. Gib zuerst die direkte Antwort. Sei kurz, einfach und inhaltlich hilfreich: normalerweise 2–5 Sätze. Nutze Listen nur wenn sie helfen. Keine unnötigen Einleitungen oder Wiederholungen. Bei schwierigen Fragen erkläre die wichtigsten Punkte verständlich. Wenn mehr Details nötig sind, liefere sie. Nutzerfrage: "+text
   })
  });
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  loading.textContent=data.reply||data.response||"Ich habe leider keine Antwort erhalten.";
  loading.classList.remove("thinking");
 }catch(e){
  loading.textContent="Keine Verbindung zur KI. Bitte versuche es erneut.";
  loading.classList.remove("thinking");
  console.error(e);
 }finally{
  busy=false;
  send.disabled=false;
  input.disabled=false;
  input.focus();
  chat.scrollTop=chat.scrollHeight;
 }
}

send.addEventListener("click",()=>ask(input.value));
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  ask(input.value);
 }
});
document.querySelectorAll(".suggestion").forEach(button=>{
 button.addEventListener("click",()=>ask(button.textContent));
});
document.getElementById("new").addEventListener("click",()=>{
 if(busy)return;
 chat.innerHTML="";
 chat.appendChild(welcome);
 welcome.hidden=false;
 input.value="";
 input.focus();
});
</script>
</body>
</html>
