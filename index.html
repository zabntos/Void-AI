
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090611">
<title>Void AI</title>
<style>
:root{color-scheme:dark;--bg:#090611;--panel:#130d20;--purple:#a855f7;--text:#fff;--muted:#b9a9ca}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg)}
body{font-family:Arial,sans-serif;color:var(--text);overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100vh;height:100dvh;display:flex;position:relative;background:radial-gradient(ellipse at 50% 0%,#45165c55,transparent 55%),var(--bg)}
.sidebar{width:255px;flex-shrink:0;background:#0d0916;border-right:1px solid #ffffff18;padding:18px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:bold}
.brand span{color:#c084fc}
.tagline{font-size:12px;color:var(--muted);margin-top:4px}
button{transition:background .15s,border-color .15s}
.newchat,.suggestion,.iconbtn{border:1px solid #ffffff20;background:#ffffff08;border-radius:12px;padding:12px}
.newchat{text-align:left;border-color:#a855f755;background:#a855f719}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.chatlist{display:flex;flex-direction:column;gap:5px;overflow:auto}
.chatrow{display:flex;gap:4px;align-items:center}
.chatopen{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:10px;font-size:13px}
.chatopen.active{background:#a855f722;border-color:#a855f733}
.del{background:transparent;border:0;color:#b9a9ca;font-size:20px;padding:5px}
.sidebottom{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.8}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{height:65px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid #ffffff18;background:#0b0712}
.status{font-size:12px;color:#c084fc;margin-top:4px}
.mobileonly{display:none}
.workspace{width:100%;max-width:900px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 22px 10px}
.messages{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:8px 2px 20px}
.welcome{text-align:center;margin:auto 0;padding:20px 0}
.sphere{width:90px;height:90px;margin:0 auto 23px;position:relative;border-radius:50%;background:radial-gradient(circle at 30% 23%,white 0%,#e7c4ff 5%,transparent 18%),radial-gradient(circle at 34% 30%,#d8a1ff,#9639e8 35%,#4c1384 67%,#12051f 100%);box-shadow:inset -12px -14px 22px #08020e99,0 0 25px #a855f788,0 0 65px #7e22ce44;animation:float 4s ease-in-out infinite}
.sphere:before{content:"";position:absolute;inset:-9px;border:1px solid #c084fc88;border-radius:50%;animation:spin 10s linear infinite}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1px;margin:0 0 12px}
.gradient{background:linear-gradient(90deg,#f5e8ff,#c084fc,#a78bfa);color:transparent;background-clip:text;-webkit-background-clip:text}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7;max-width:430px;margin:0 auto 24px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-width:560px;margin:auto}
.suggestion{text-align:left;font-size:12px;line-height:1.5}
.suggestion strong{display:block;font-size:13px;margin-bottom:4px}
.suggestion span{color:var(--muted)}
.msg{display:flex;align-items:flex-start;gap:10px}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;flex-shrink:0;border-radius:10px;background:#7029a6;display:grid;place-items:center}
.msgbody{min-width:0;max-width:calc(100% - 42px)}
.user .msgbody{display:flex;flex-direction:column;align-items:flex-end}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:14px;padding:12px 15px;background:#171020;border:1px solid #ffffff18;border-radius:4px 15px 15px 15px}
.user .bubble{background:#55248a55;border-radius:15px 4px 15px 15px}
.bubble pre{white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto}
.actions{display:flex;gap:5px;margin-top:5px}
.action{background:transparent;border:0;color:var(--muted);font-size:12px;padding:6px}
.composerarea{flex-shrink:0;padding-top:8px}
.composer{display:flex;align-items:flex-end;gap:7px;padding:8px;border:1px solid #a855f766;border-radius:17px;background:#130d20;box-shadow:0 8px 35px #0005}
#prompt{display:block;flex:1;min-width:0;width:100%;min-height:44px;max-height:130px;resize:none;border:0;outline:none;background:transparent;color:#fff;-webkit-text-fill-color:#fff;caret-color:#d8b4fe;font-size:16px;line-height:1.4;padding:12px 7px;margin:0;opacity:1;pointer-events:auto}
#prompt::placeholder{color:#b9a9ca;-webkit-text-fill-color:#b9a9ca}
.iconbtn{min-width:42px;min-height:42px}
.send{width:44px;height:44px;flex-shrink:0;border:0;border-radius:12px;background:linear-gradient(135deg,#c084fc,#7c3aed);font-size:20px}
.send:disabled{opacity:.5}
.hint{text-align:center;font-size:10px;color:#81768f;padding:8px 0 0}
.typing{font-size:13px;color:var(--muted);padding:10px}
@media(max-width:700px){
.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;height:100%;height:100dvh;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 35px #0009}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block;position:fixed;z-index:4;inset:0;background:#0009}
.mobileonly{display:inline-block}
.topbar{height:58px;padding:8px 12px}
.workspace{padding:10px 10px 7px}
.sphere{width:70px;height:70px;margin-bottom:18px}
.welcome{padding:10px 0}
.welcome p{font-size:13px;margin-bottom:18px}
.suggestions{gap:7px}
.suggestion{padding:10px;font-size:11px}
.suggestion strong{font-size:12px}
.composer{gap:4px;padding:6px}
#prompt{padding:12px 5px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="sphere" style="width:43px;height:43px;margin:0"></div><div>Void <span>AI</span><div class="tagline">Deine KI. Dein Universum.</div></div></div>
  <button class="newchat" id="newChat">＋ Neuer Chat</button>
  <div class="label">Deine Chats</div>
  <div class="chatlist" id="chatList"></div>
  <div class="sidebottom">✦ Void AI 2.0<br>Deine Chats werden lokal gespeichert.<br>KI-Antworten können Fehler enthalten.</div>
</aside>
<div class="overlay" id="overlay"></div>
<main class="main">
<header class="topbar">
  <div><button class="iconbtn mobileonly" id="menuBtn">☰</button> <b>Void AI <span class="gradient">✦</span></b><div class="status" id="status">Bereit für deine Fragen</div></div>
  <button class="iconbtn" id="clearBtn" title="Neuer Chat">＋</button>
</header>
<section class="workspace">
<div class="messages" id="messages" aria-live="polite"></div>
<div class="composerarea">
<form class="composer" id="chatForm">
<textarea id="prompt" rows="1" maxlength="6000" placeholder="Frag Void AI etwas..." aria-label="Nachricht schreiben"></textarea>
<button class="iconbtn" type="button" id="voiceBtn" title="Spracheingabe">🎙</button>
<button class="send" type="submit" id="sendBtn" aria-label="Senden">➤</button>
</form>
<div class="hint">Enter zum Senden · Shift + Enter für eine neue Zeile</div>
</div>
</section>
</main>
</div>
<script>
"use strict";

/* Bestehenden Cloudflare-Worker NICHT ändern. */
const API_URL="https://void-ai-api.cguerpinar.workers.dev/";
const STORE="void_ai_2_chats";
const ACTIVE="void_ai_2_active";
const $=id=>document.getElementById(id);
let chats=[],activeId=null,busy=false,recognition=null;

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fresh(){return {id:id(),title:"Neuer Chat",messages:[],updated:Date.now()}}
function current(){return chats.find(c=>c.id===activeId)}
function status(t){$("status").textContent=t}
function save(){try{localStorage.setItem(STORE,JSON.stringify(chats.slice(0,60)));localStorage.setItem(ACTIVE,activeId||"")}catch(e){}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function format(s){return escapeHTML(s).replace(/```([\s\S]*?)```/g,(_,c)=>"<pre>"+c.trim()+"</pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")}
function welcome(){return `<div class="welcome"><div class="sphere" aria-label="Void AI Kugel"></div><h1>Willkommen bei <span class="gradient">Void AI</span></h1><p>Dein Raum für Ideen, Wissen und Kreativität. Was möchtest du entdecken?</p><div class="suggestions"><button class="suggestion" data-q="Erkläre mir ein schwieriges Thema einfach."><strong>✧ Einfach erklärt</strong><span>Schwieriges verständlich machen</span></button><button class="suggestion" data-q="Hilf mir, eine coole Idee zu entwickeln."><strong>✧ Neue Ideen</strong><span>Kreativ denken und planen</span></button><button class="suggestion" data-q="Hilf mir beim Programmieren."><strong>⌘ Programmieren</strong><span>Code erstellen und verstehen</span></button><button class="suggestion" data-q="Erzähl mir interessante Fakten über das Universum."><strong>✦ Wissen entdecken</strong><span>Neue Dinge lernen</span></button></div></div>`}
function renderMessages(){
 const box=$("messages"),c=current();box.innerHTML="";
 if(!c||!c.messages.length){
  box.innerHTML=welcome();
  box.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{$("prompt").value=b.dataset.q;send()}));
  return;
 }
 c.messages.forEach(m=>{
  const row=document.createElement("div");row.className="msg "+(m.role==="user"?"user":"assistant");
  const av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"●":"✦";
  const body=document.createElement("div");body.className="msgbody";
  const bubble=document.createElement("div");bubble.className="bubble";bubble.innerHTML=format(m.content);body.appendChild(bubble);
  if(m.role==="assistant"){
   const actions=document.createElement("div");actions.className="actions";
   const cp=document.createElement("button");cp.className="action";cp.textContent="▢ Kopieren";cp.onclick=async()=>{try{await navigator.clipboard.writeText(m.content);cp.textContent="✓ Kopiert"}catch(e){status("Kopieren nicht verfügbar")}};
   const rd=document.createElement("button");rd.className="action";rd.textContent="🔊 Vorlesen";rd.onclick=()=>{if(!window.speechSynthesis)return status("Vorlesen nicht unterstützt");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(m.content);u.lang="de-DE";speechSynthesis.speak(u)};
   actions.append(cp,rd);body.appendChild(actions);
  }
  row.append(av,body);box.appendChild(row);
 });
 box.scrollTop=box.scrollHeight;
}
function renderChats(){
 const list=$("chatList");list.innerHTML="";
 chats.forEach(c=>{
  const row=document.createElement("div");row.className="chatrow";
  const b=document.createElement("button");b.className="chatopen"+(c.id===activeId?" active":"");b.textContent=c.title||"Neuer Chat";b.onclick=()=>{if(busy)return;activeId=c.id;save();render();closeMenu()};
  const d=document.createElement("button");d.className="del";d.textContent="×";d.title="Chat löschen";d.onclick=()=>{if(busy)return;chats=chats.filter(x=>x.id!==c.id);if(activeId===c.id)activeId=chats[0]?.id||null;if(!activeId){let n=fresh();chats.unshift(n);activeId=n.id}save();render()};
  row.append(b,d);list.appendChild(row);
 });
}
function render(){renderChats();renderMessages()}
function closeMenu(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
function newChat(){if(busy)return;let c=fresh();chats.unshift(c);activeId=c.id;save();render();closeMenu();$("prompt").focus()}
function add(role,content){let c=current();if(!c)return;c.messages.push({role,content});c.updated=Date.now();if(role==="user"&&c.title==="Neuer Chat")c.title=content.slice(0,34);save()}
function resize(){let p=$("prompt");p.style.height="auto";p.style.height=Math.min(p.scrollHeight,130)+"px"}
async function send(){
 if(busy)return;let input=$("prompt"),q=input.value.trim();if(!q)return;
 if(!current()){let c=fresh();chats.unshift(c);activeId=c.id}
 add("user",q);input.value="";resize();busy=true;$("sendBtn").disabled=true;status("Void AI denkt nach...");render();
 let typing=document.createElement("div");typing.className="typing";typing.id="typing";typing.textContent="Void AI denkt nach …";$("messages").appendChild(typing);
 try{
  let c=current(),history=c.messages.slice(-11,-1).map(m=>(m.role==="user"?"Nutzer":"Void AI")+": "+m.content).join("\n\n");
  let message="Du bist Void AI, ein hilfreicher Assistent. Antworte in der Sprache des Nutzers, klar und direkt. Erkläre schwierige Themen einfach und erfinde keine Fakten."+(history?"\nBisheriger Chat:\n"+history:"")+"\n\nAktuelle Frage:\n"+q;
  let res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  let raw=await res.text(),data;try{data=JSON.parse(raw)}catch(e){data={reply:raw}}
  if(!res.ok)throw Error(data.error||data.message||"HTTP "+res.status);
  let answer=data.reply??data.response??data.message??data.output??data.result;
  if(typeof answer!=="string"||!answer.trim())throw Error("Keine Antwort vom Worker erhalten.");
  add("assistant",answer.trim());status("Bereit für deine Fragen");
 }catch(e){
  add("assistant","Void AI konnte gerade nicht antworten. "+(e.message||"Bitte prüfe deine Verbindung."));
  status("Verbindung fehlgeschlagen");
 }finally{
  busy=false;$("sendBtn").disabled=false;$("typing")?.remove();render();$("prompt").focus();
 }
}
function load(){
 try{let a=JSON.parse(localStorage.getItem(STORE)||"[]");if(Array.isArray(a))chats=a.filter(c=>c&&c.id&&Array.isArray(c.messages));activeId=localStorage.getItem(ACTIVE)}catch(e){chats=[]}
 if(!current()){if(chats.length)activeId=chats[0].id;else{let c=fresh();chats=[c];activeId=c.id}}
 render();
}
$("chatForm").addEventListener("submit",e=>{e.preventDefault();send()});
$("prompt").addEventListener("input",resize);
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("newChat").onclick=newChat;$("clearBtn").onclick=newChat;
$("menuBtn").onclick=()=>{$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show")};
$("overlay").onclick=closeMenu;
$("voiceBtn").onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){status("Spracheingabe wird nicht unterstützt");return}
 if(recognition){recognition.stop();recognition=null;return}
 recognition=new SR();recognition.lang="de-DE";
 recognition.onresult=e=>{$("prompt").value+=($("prompt").value?" ":"")+e.results[0][0].transcript;resize()};
 recognition.onerror=()=>status("Mikrofon nicht verfügbar");
 recognition.onend=()=>{recognition=null;status("Bereit für deine Fragen")};
 status("Ich höre zu…");recognition.start();
};
load();
</script>
</body>
</html>
