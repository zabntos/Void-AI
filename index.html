
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090611">
<meta name="description" content="Void AI – Deine KI. Deine Welt.">
<title>Void AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   VOID AI — DESIGN SYSTEM
   ========================================================= */

:root {
  color-scheme: dark;
  --bg: #090611;
  --bg-soft: #0d0815;
  --panel: #130d20;
  --panel-light: #1a1127;
  --panel-hover: #241532;
  --border: #352449;
  --border-light: #4b3265;
  --purple: #a855f7;
  --purple-light: #d8b4fe;
  --purple-dark: #6b21a8;
  --text: #f8f5ff;
  --muted: #aa9bbd;
  --danger: #fca5a5;
  --success: #86efac;
  --radius: 18px;
  --sidebar-width: 260px;
  --transition: 180ms ease;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
a:focus-visible {
  outline: 2px solid var(--purple-light);
  outline-offset: 3px;
}

button,
input,
textarea {
  -webkit-tap-highlight-color: transparent;
}

.hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}

.purple {
  color: var(--purple-light);
}

.small {
  font-size: 12px;
}

.full {
  width: 100%;
}

.center {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

button.primary {
  background: linear-gradient(135deg, #9333ea, #7e22ce);
  color: white;
  border: 1px solid #a855f7;
}

button.primary:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
}

button.secondary {
  background: var(--panel-hover);
  border: 1px solid var(--border);
  color: var(--text);
}

button.secondary:hover {
  background: #301b42;
  border-color: var(--border-light);
}

button {
  border-radius: 12px;
  padding: 11px 15px;
  font-weight: 650;
  transition:
    background var(--transition),
    border-color var(--transition),
    transform var(--transition),
    opacity var(--transition);
}

input,
textarea {
  width: 100%;
  background: #0d0815;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  outline: none;
  transition: border-color var(--transition);
}

input:focus,
textarea:focus {
  border-color: var(--purple);
}

input::placeholder,
textarea::placeholder {
  color: #82718f;
}

a {
  color: var(--purple-light);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-9px);
  }
}

@keyframes pulse {
  0%, 100% {
    opacity: .65;
    transform: scale(.98);
  }

  50% {
    opacity: 1;
    transform: scale(1.02);
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}

/* =========================================================
   AUTHENTICATION SCREEN
   ========================================================= */

#authScreen {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 15% 15%, #6b21a81b, transparent 45%),
    radial-gradient(ellipse at 85% 80%, #9333ea18, transparent 40%),
    var(--bg);
}

.auth-glow {
  position: absolute;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  background: #9333ea0c;
  filter: blur(70px);
  pointer-events: none;
  z-index: -1;
}

.auth-glow.one {
  top: -120px;
  left: -100px;
}

.auth-glow.two {
  right: -100px;
  bottom: -120px;
}

.auth-card {
  width: 100%;
  max-width: 430px;
  padding: 30px;
  background: #130d20f5;
  border: 1px solid var(--border);
  border-radius: 25px;
  box-shadow: 0 20px 80px #00000055, 0 0 40px #9333ea0c;
  animation: appear .35s ease both;
  backdrop-filter: blur(14px);
}

.logo {
  text-align: center;
  font-size: 33px;
  font-weight: 950;
  letter-spacing: 2px;
  color: var(--purple-light);
  text-shadow: 0 0 25px #a855f740;
}

.logo-mark {
  display: inline-block;
  margin-right: 5px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin: 8px 0 26px;
  font-size: 14px;
}

.auth-card h2 {
  text-align: center;
  font-size: 23px;
  margin: 0 0 22px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  color: #d8c6ec;
  font-size: 13px;
  margin-bottom: 7px;
}

.field input {
  margin: 0;
}

.auth-submit {
  margin-top: 8px;
  min-height: 47px;
}

.switch {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-top: 20px;
}

.switch a {
  text-decoration: none;
  cursor: pointer;
  font-weight: 700;
}

.switch a:hover {
  text-decoration: underline;
}

.auth-footer {
  text-align: center;
  color: #766783;
  font-size: 11px;
  margin-top: 25px;
}

#status {
  color: var(--purple-light);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

#error {
  color: var(--danger);
  font-size: 13px;
  line-height: 1.6;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

#success {
  color: var(--success);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 8px;
}

/* =========================================================
   VERIFICATION MODAL
   ========================================================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05020ad9;
  backdrop-filter: blur(10px);
}

.modal-box {
  width: 100%;
  max-width: 410px;
  padding: 30px;
  text-align: center;
  border: 1px solid #70409a;
  border-radius: 23px;
  background:
    radial-gradient(ellipse at top, #9333ea17, transparent 65%),
    var(--panel);
  box-shadow: 0 20px 90px #0009, 0 0 45px #9333ea20;
  animation: appear .25s ease both;
}

.modal-icon {
  width: 70px;
  height: 70px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  margin: 0 auto 18px;
  background: #9333ea1c;
  border: 1px solid #9333ea4a;
  font-size: 34px;
}

.modal-box h2 {
  margin: 0 0 12px;
  color: var(--purple-light);
  font-size: 24px;
}

.modal-box p {
  color: #c4b5d5;
  font-size: 14px;
  line-height: 1.65;
}

.verify-address {
  padding: 12px;
  margin: 15px 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #0d0815;
  color: var(--purple-light);
  overflow-wrap: anywhere;
}

.modal-actions {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}

.modal-note {
  color: var(--muted) !important;
  font-size: 12px !important;
}

/* =========================================================
   MAIN APPLICATION LAYOUT
   ========================================================= */

.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  background: var(--bg);
}

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 14px;
  background: #100b19;
  border-right: 1px solid #2b1c39;
}

.brand {
  padding: 7px 8px 17px;
  font-size: 25px;
  font-weight: 950;
  letter-spacing: 1px;
  color: var(--purple-light);
}

.brand span {
  color: white;
}

.side-button {
  width: 100%;
  text-align: left;
}

.side-label {
  font-size: 12px;
  color: var(--muted);
}

.sidebar-heading {
  padding: 15px 8px 4px;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #857492;
}

#chatList {
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
  max-height: 45vh;
}

.chat-item {
  width: 100%;
  padding: 11px 12px;
  text-align: left;
  font-size: 13px;
  font-weight: 450;
  background: transparent;
  border: 1px solid transparent;
  color: #c9bad8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-item:hover {
  background: #1b1126;
}

.chat-item.active {
  background: #291638;
  border-color: #5c3479;
  color: white;
}

.sidebar-spacer {
  flex: 1;
  min-height: 15px;
}

.userbox {
  padding-top: 15px;
  border-top: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.user-avatar {
  width: 37px;
  height: 37px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(135deg, #9333ea, #581c87);
  font-weight: 850;
}

.user-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-details {
  min-width: 0;
  flex: 1;
}

#userName {
  font-size: 13px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

#userEmail {
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
  margin-top: 3px;
}

.logout-button {
  margin-top: 13px;
}

/* =========================================================
   MAIN CHAT
   ========================================================= */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.top {
  min-height: 64px;
  padding: 13px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #261a32;
  background: #090611e8;
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(14px);
}

.top-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.top-title {
  font-weight: 850;
  color: var(--purple-light);
}

.top-subtitle {
  font-size: 12px;
  color: var(--muted);
}

.connection-indicator {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #9c8aa9;
  font-size: 11px;
}

.connection-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #a855f7;
  box-shadow: 0 0 10px #a855f7;
}

.messages {
  flex: 1;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 30px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.welcome {
  margin: auto;
  max-width: 500px;
  width: 100%;
  padding: 30px 10px;
  text-align: center;
  animation: appear .4s ease both;
}

.sphere {
  width: 105px;
  height: 105px;
  margin: 0 auto 27px;
  position: relative;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 24%, #f5eaff 0%, #d8b4fe 10%,
      #a855f7 27%, #6b21a8 49%, #28103f 72%, #090611 100%);
  box-shadow:
    0 0 35px #9333ea65,
    0 0 80px #9333ea18,
    inset -12px -15px 25px #05020a;
  animation: float 3s ease-in-out infinite;
}

.sphere::after {
  content: "";
  position: absolute;
  inset: -9px;
  border: 1px solid #a855f72b;
  border-radius: 50%;
  animation: pulse 3s ease-in-out infinite;
}

.welcome h1 {
  margin: 0 0 12px;
  font-size: clamp(25px, 4vw, 34px);
  letter-spacing: -.7px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.7;
}

.welcome-tip {
  display: inline-block;
  margin-top: 14px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: #bca9cf;
  background: #130d20;
  font-size: 12px;
}

/* =========================================================
   MESSAGE BUBBLES
   ========================================================= */

.msg {
  max-width: 88%;
  padding: 15px 17px;
  border-radius: 17px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: appear .18s ease both;
}

.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #632a8e, #472064);
  border: 1px solid #8243ae;
  border-bottom-right-radius: 5px;
}

.msg.ai {
  align-self: flex-start;
  background: #171020;
  border: 1px solid #33223f;
  border-bottom-left-radius: 5px;
}

.msg-label {
  display: block;
  margin-bottom: 6px;
  color: var(--purple-light);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .6px;
}

.msg-content {
  overflow-wrap: anywhere;
}

.msg-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.msg-tools button {
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 600;
}

.typing {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 5px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--purple-light);
  animation: pulse .8s ease-in-out infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

/* =========================================================
   MESSAGE COMPOSER
   ========================================================= */

.composer {
  position: sticky;
  bottom: 0;
  z-index: 4;
  padding: 12px 18px 10px;
  background: linear-gradient(transparent, var(--bg) 15%);
}

.compose-inner {
  max-width: 820px;
  margin: 0 auto;
  padding: 10px;
  border: 1px solid #49305e;
  border-radius: 19px;
  background: #130d20;
  box-shadow: 0 10px 40px #00000022;
  transition: border-color var(--transition);
}

.compose-inner:focus-within {
  border-color: #8650ac;
}

#prompt {
  display: block;
  width: 100%;
  min-height: 45px;
  max-height: 180px;
  padding: 10px;
  resize: none;
  background: transparent;
  border: 0;
  border-radius: 10px;
  line-height: 1.6;
}

#prompt:focus {
  border: 0;
  outline: none;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 2px 1px;
}

.actions-left,
.actions-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.smallbtn {
  padding: 9px 12px;
  font-size: 12px;
}

#micStatus {
  font-size: 12px;
}

#micStatus:empty {
  display: none;
}

.composer-note {
  max-width: 820px;
  margin: 9px auto 0;
  text-align: center;
  font-size: 10px;
  color: #756582;
  line-height: 1.5;
}

#sendBtn {
  min-width: 95px;
}

/* =========================================================
   MOBILE NAVIGATION
   ========================================================= */

.mobile-menu {
  display: none;
}

.sidebar-backdrop {
  display: none;
}

/* =========================================================
   RESPONSIVE DESIGN
   ========================================================= */

@media (max-width: 760px) {
  :root {
    --sidebar-width: 260px;
  }

  .sidebar {
    position: fixed;
    z-index: 100;
    top: 0;
    bottom: 0;
    left: 0;
    width: var(--sidebar-width);
    transform: translateX(-105%);
    transition: transform .22s ease;
    box-shadow: 15px 0 50px #0005;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-backdrop.open {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 90;
    background: #0009;
  }

  .mobile-menu {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 39px;
    height: 39px;
    padding: 0;
    font-size: 19px;
  }

  .top {
    padding: 11px 13px;
    min-height: 59px;
  }

  .top-subtitle {
    display: none;
  }

  .messages {
    padding: 23px 13px 30px;
    gap: 15px;
  }

  .msg {
    max-width: 96%;
    padding: 13px 14px;
    font-size: 14px;
  }

  .composer {
    padding: 9px 9px 8px;
  }

  .composer-note {
    font-size: 9px;
  }

  .welcome {
    padding: 20px 6px;
  }

  .sphere {
    width: 88px;
    height: 88px;
  }

  .auth-card {
    padding: 24px 20px;
  }
}

@media (max-width: 380px) {
  .auth-card {
    padding: 21px 16px;
  }

  .logo {
    font-size: 28px;
  }

  .actions {
    gap: 5px;
  }

  #sendBtn {
    min-width: 78px;
    padding: 9px;
  }

  .smallbtn {
    padding: 9px;
  }

  #micStatus {
    font-size: 10px;
  }
}

/* =========================================================
   ACCESSIBILITY AND SCROLLBARS
   ========================================================= */

* {
  scrollbar-width: thin;
  scrollbar-color: #49305e transparent;
}

::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #49305e;
  border-radius: 99px;
}

::selection {
  background: #9333ea70;
  color: white;
}
</style>
</head>

<body>

<!-- =======================================================
     REGISTRATION AND LOGIN
     ======================================================= -->

<section id="authScreen" class="center">
  <div class="auth-glow one"></div>
  <div class="auth-glow two"></div>

  <div class="auth-card">
    <div class="logo">
      <span class="logo-mark">✦</span> VOID AI
    </div>

    <div class="subtitle">Deine KI. Deine Welt.</div>

    <!-- REGISTRATION -->

    <form id="registerForm">
      <h2>Konto erstellen</h2>

      <div class="field">
        <label for="regName">Name</label>
        <input
          id="regName"
          type="text"
          autocomplete="name"
          placeholder="Dein Name"
          maxlength="60"
          required
        >
      </div>

      <div class="field">
        <label for="regEmail">E-Mail-Adresse</label>
        <input
          id="regEmail"
          type="email"
          autocomplete="email"
          placeholder="name@beispiel.de"
          required
        >
      </div>

      <div class="field">
        <label for="regPassword">Passwort</label>
        <input
          id="regPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Mindestens 6 Zeichen"
          minlength="6"
          required
        >
      </div>

      <div class="field">
        <label for="regConfirm">Passwort bestätigen</label>
        <input
          id="regConfirm"
          type="password"
          autocomplete="new-password"
          placeholder="Passwort erneut eingeben"
          minlength="6"
          required
        >
      </div>

      <button id="registerBtn" class="primary full auth-submit" type="submit">
        Konto erstellen
      </button>

      <div class="switch">
        Schon ein Konto?
        <a id="showLogin" role="button" tabindex="0">Anmelden</a>
      </div>
    </form>

    <!-- LOGIN -->

    <form id="loginForm" class="hidden">
      <h2>Willkommen zurück</h2>

      <div class="field">
        <label for="loginEmail">E-Mail-Adresse</label>
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="Deine E-Mail-Adresse"
          required
        >
      </div>

      <div class="field">
        <label for="loginPassword">Passwort</label>
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Dein Passwort"
          required
        >
      </div>

      <button id="loginBtn" class="primary full auth-submit" type="submit">
        Anmelden
      </button>

      <div class="switch">
        Noch kein Konto?
        <a id="showRegister" role="button" tabindex="0">Registrieren</a>
      </div>

      <div class="switch">
        <a id="showForgot" role="button" tabindex="0">
          Passwort vergessen?
        </a>
      </div>
    </form>

    <!-- PASSWORD RESET -->

    <form id="forgotForm" class="hidden">
