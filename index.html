
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0712">
<title>Void AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#090711;--panel:#151020;--purple:#9450ed;--text:#f5f0ff;--muted:#a69bb9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:430px;background:var(--panel);border:1px solid #38254f;border-radius:24px;padding:28px;box-shadow:0 0 65px #8535d51c}
.brand{font-weight:900;letter-spacing:2px;font-size:27px}
.brand span{color:#bb8bff}
.tagline{color:var(--muted);margin:10px 0 25px}
h1,h2,p{overflow-wrap:anywhere}
.field{margin:15px 0}
label{display:block;font-size:13px;color:#c9bedb;margin-bottom:8px}
input,textarea{width:100%;background:#0c0914;border:1px solid #3d304f;border-radius:10px;padding:14px;color:white;outline:none}
input:focus,textarea:focus{border-color:#a66bff}
.primary{width:100%;border:0;border-radius:10px;background:var(--purple);color:white;font-weight:bold;padding:14px;margin-top:10px}
.secondary{background:transparent;border:1px solid #48365f;color:#d5baff;padding:10px;border-radius:9px}
.switch{color:#c8b2ec;text-align:center;font-size:14px;margin-top:20px}
.switch button{background:none;border:0;color:#c08bff;text-decoration:underline}
#authStatus,#chatStatus{color:#e4c8ff;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:65px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #2c203d;background:#100c19}
.header-actions{display:flex;align-items:center;gap:10px}
#layout{display:flex;flex:1;min-height:0}
aside{width:240px;flex-shrink:0;background:#100c19;border-right:1px solid #2c203d;padding:14px;display:flex;flex-direction:column;gap:10px}
#history{overflow:auto;display:flex;flex-direction:column;gap:7px}
.history-item{border:0;background:#1a1425;color:#d7cde5;padding:11px;border-radius:9px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#messages{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto;max-width:500px}
.orb{width:76px;height:76px;border-radius:50%;margin:0 auto 25px;background:radial-gradient(circle at 30% 25%,#d6b8ff,#8b41e6 35%,#211034 72%);box-shadow:0 0 45px #9346e65b}
.welcome h1{font-size:clamp(28px,5vw,42px);margin:0 0 12px}
.welcome p{color:var(--muted);line-height:1.6}
.message{width:100%;max-width:780px;margin:0 auto;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.message .who{font-size:12px;color:#c69aff;font-weight:bold;margin-bottom:6px}
.message .bubble{background:#171222;border:1px solid #2e2140;border-radius:14px;padding:15px}
.message.user .bubble{background:#211633}
#composer{padding:12px 16px 18px;border-top:1px solid #251b34}
.composer-inner{max-width:800px;margin:auto;display:flex;gap:10px;align-items:end}
#prompt{resize:none;min-height:50px;max-height:150px;flex:1;line-height:1.5}
#send{width:52px;height:50px;border:0;border-radius:11px;background:var(--purple);color:white;font-size:22px}
#chatStatus{max-width:800px;margin:7px auto 0}
.footer{text-align:center;font-size:11px;color:#82758f;margin-top:10px}
@media(max-width:650px){
 aside{width:66px;padding:9px 6px}
 aside .side-label{display:none}
 aside .brand{font-size:0}
 aside .brand:after{content:"V";font-size:22px;color:#bb8bff}
 aside .secondary{font-size:11px;padding:10px 2px}
 .history-item{font-size:0;padding:12px 2px;text-align:center}
 .history-item:after{content:"•";font-size:20px}
 #messages{padding:20px 12px}
 header{padding:0 10px}
 .header-actions{gap:5px}
 .auth-card{padding:23px}
}
</style>
</head>
<body>

<section id="auth">
  <div class="auth-card">
    <div class="brand">VOID <span>AI</span></div>
    <p class="tagline">Your AI. Your world.</p>

    <form id="authForm">
      <div class="field" id="nameField">
        <label for="name">Your name</label>
        <input id="name" autocomplete="name" placeholder="Name">
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="At least 6 characters">
      </div>
      <div class="field hidden" id="confirmField">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Repeat password">
      </div>
      <button class="primary" id="authSubmit" type="submit">Log in</button>
    </form>

    <div class="switch">
      <span id="switchText">New to Void AI?</span>
      <button id="switchMode" type="button">Create account</button>
    </div>
    <p id="authStatus" role="status"></p>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="brand">VOID <span>AI</span></div>
    <div class="header-actions">
      <span id="userLabel" style="font-size:12px;color:#c7b5dc"></span>
      <button class="secondary" id="logout">Log out</button>
    </div>
  </header>

  <div id="layout">
    <aside>
      <button class="primary" id="newChat">+ <span class="side-label">New chat</span></button>
      <div style="color:#9687aa;font-size:12px" class="side-label">YOUR CHATS</div>
      <div id="history"></div>
    </aside>

    <main id="main">
      <div id="messages">
        <div class="welcome">
          <div class="orb"></div>
          <h1>What can I help with?</h1>
          <p>Ask questions, learn something new, write code, or brainstorm ideas.</p>
        </div>
      </div>

      <div id="composer">
        <div class="composer-inner">
          <textarea id="prompt" rows="1" placeholder="Message Void AI..." aria-label="Message Void AI"></textarea>
          <button id="send" aria-label="Send message">↑</button>
        </div>
        <div id="chatStatus" role="status"></div>
        <div class="footer">Void AI can make mistakes. Check important information.</div>
      </div>
    </main>
  </div>
</section>

<script>
/* ===== YOUR CONFIGURATION ===== */
const SUPABASE_URL = "https://onewdrztvuffzxdnqmvi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X74KchzYmRvLdl_wb0ISkQ_-PNOnJAA";
const AI_ENDPOINT = "https://void-ai-api.cguerpinar.workers.dev/";
/* ============================== */

const $ = id => document.getElementById(id);
const supabaseReady = !!window.supabase;

let db = null;
let registering = false;
let currentUser = null;
let chats = [];
let activeChat = null;
let sending = false;

if (supabaseReady) {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function authMessage(text) {
  $("authStatus").textContent = text;
}
function chatMessage(text) {
  $("chatStatus").textContent = text;
}
function setMode(create) {
  registering = create;
  $("nameField").classList.toggle("hidden", !create);
  $("confirmField").classList.toggle("hidden", !create);
  $("name").required = create;
  $("confirm").required = create;
  $("password").autocomplete = create ? "new-password" : "current-password";
  $("authSubmit").textContent = create ? "Create account" : "Log in";
  $("switchText").textContent = create ? "Already registered?" : "New to Void AI?";
  $("switchMode").textContent = create ? "Log in" : "Create account";
  authMessage("");
}

$("switchMode").addEventListener("click", () => setMode(!registering));

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db) {
    authMessage("Supabase could not load. Check your internet connection.");
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  const name = $("name").value.trim();

  if (registering && password !== $("confirm").value) {
    authMessage("Your passwords do not match.");
    return;
  }

  const button = $("authSubmit");
  button.disabled = true;
  authMessage(registering ? "Creating your account..." : "Logging in...");

  try {
    if (registering) {
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { display_name: name }
        }
      });

      if (error) throw error;

      if (data.session) {
        await enterApp(data.session.user);
      } else {
        authMessage("Account created. Check your email if confirmation is enabled, then log in.");
        setMode(false);
      }
    } else {
      const { data, error } = await db.auth.signInWithPassword({
        email, password
      });
      if (error) throw error;
      await enterApp(data.user);
    }
  } catch (error) {
    authMessage(error.message || "Authentication failed.");
  } finally {
    button.disabled = false;
  }
});

async function enterApp(user) {
  currentUser = user;
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userLabel").textContent =
    user.user_metadata?.display_name || user.email || "Signed in";
  await loadChats();
}

async function logout() {
  if (db) await db.auth.signOut();
  currentUser = null;
  chats = [];
  activeChat = null;
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
  $("messages").innerHTML = "";
  $("history").innerHTML = "";
  $("userLabel").textContent = "";
  setMode(false);
}

$("logout").addEventListener("click", logout);

function storageKey() {
  return currentUser ? "void_ai_chats_" + currentUser.id : "";
}

async function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem(storageKey()) || "[]");
    if (!Array.isArray(chats)) chats = [];
  } catch {
    chats = [];
  }

  if (chats.length) {
    activeChat = chats[0].id;
    renderHistory();
    renderChat();
  } else {
    createChat();
  }
}

function saveChats() {
  if (!currentUser) return;
  try {
    localStorage.setItem(storageKey(), JSON.stringify(chats));
  } catch {
    chatMessage("Browser storage is full. Your latest chat may not be saved.");
  }
}

function createChat() {
  const chat = {
    id: crypto.randomUUID(),
    title: "New chat",
    messages: []
  };
  chats.unshift(chat);
  activeChat = chat.id;
  saveChats();
  renderHistory();
  renderChat();
  $("prompt").focus();
}

function currentChat() {
  return chats.find(chat => chat.id === activeChat);
}

$("newChat").addEventListener("click", createChat);

function renderHistory() {
  const history = $("history");
  history.innerHTML = "";

  chats.forEach(chat => {
    const button = document.createElement("button");
    button.className = "history-item";
    button.textContent = chat.title || "New chat";
    button.title = chat.title || "New chat";
    button.style.border = chat.id === activeChat
      ? "1px solid #8552b8" : "1px solid transparent";
    button.addEventListener("click", () => {
      activeChat = chat.id;
      renderHistory();
      renderChat();
    });
    history.appendChild(button);
  });
}

function renderChat() {
  const container = $("messages");
  container.innerHTML = "";
  const chat = currentChat();

  if (!chat || !chat.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML =
      '<div class="orb"></div><h1>What can I help with?</h1>' +
      '<p>Ask questions, learn something new, write code, or brainstorm ideas.</p>';
    container.appendChild(welcome);
    return;
  }

  chat.messages.forEach(message => {
    const row = document.createElement("div");
    row.className = "message " + message.role;

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = message.role === "user" ? "YOU" : "VOID AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message.content;

    row.append(who, bubble);
    container.appendChild(row);
  });

  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  if (sending || !currentUser) return;

  const text = $("prompt").value.trim();
  if (!text) return;

  if (!AI_ENDPOINT.startsWith("https://")) {
    chatMessage("The AI endpoint is not configured.");
    return;
  }

  const chat = currentChat();
  if (!chat) return;

  sending = true;
  $("send").disabled = true;
  $("prompt").disabled = true;
  $("prompt").value = "";
  chat.messages.push({ role: "user", content: text });

  if (chat.title === "New chat") {
    chat.title = text.slice(0, 38);
  }

  renderHistory();
  renderChat();
  chatMessage("Void AI is thinking...");
  saveChats();

  try {
    const response = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    if (!response.ok) {
      throw new Error("AI server returned HTTP " + response.status);
    }

    const data = await response.json();
    const reply = data.reply || data.response || data.message;

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("The AI server returned no reply.");
    }

    chat.messages.push({ role: "assistant", content: reply.trim() });
    chatMessage("");
  } catch (error) {
    chat.messages.push({
      role: "assistant",
      content: "I couldn't load a reply. Please try again. Details: " +
        (error.message || "Connection failed")
    });
    chatMessage("AI connection failed. Check that your Worker is online.");
  } finally {
    sending = false;
    $("send").disabled = false;
    $("prompt").disabled = false;
    $("prompt").focus();
    saveChats();
    renderHistory();
    renderChat();
  }
}

$("send").addEventListener("click", sendMessage);

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

if (db) {
  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") {
      currentUser = null;
      $("app").classList.add("hidden");
      $("auth").classList.remove("hidden");
    }
  });

  db.auth.getSession().then(({ data, error }) => {
    if (error) {
      authMessage(error.message);
      return;
    }
    if (data.session?.user) {
      enterApp(data.session.user);
    }
  }).catch(() => {
    authMessage("Could not check your saved login.");
  });
} else {
  authMessage("Supabase did not load. Check your internet connection.");
}

setMode(false);
</script>
</body>
</html>
