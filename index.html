
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void AI – Konto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;color:#fff;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at top,#451477,#10091c 55%,#07050d);
}
.card{
 width:100%;max-width:420px;padding:30px;
 background:#171020;border:1px solid #7135a5;border-radius:22px;
 box-shadow:0 20px 80px #0008;
}
.logo{text-align:center;font-size:35px;font-weight:900;
 background:linear-gradient(90deg,#c084fc,#f0abfc);
 color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{text-align:center;color:#b9a8cc;margin-bottom:25px}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tabs button,.submit{
 flex:1;padding:13px;border:0;border-radius:10px;
 background:#2b1b3b;color:#fff;font-weight:bold;cursor:pointer
}
.tabs button.active,.submit{
 background:linear-gradient(100deg,#9333ea,#c026d3)
}
label{display:block;margin:15px 0 7px;font-size:14px}
input{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #49365c;background:#0d0913;color:#fff;
 outline:none;font-size:15px
}
input:focus{border-color:#c084fc}
.submit{width:100%;margin-top:22px;font-size:15px}
button:disabled{opacity:.6}
#message{margin-top:16px;padding:12px;border-radius:9px;
 font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.error{background:#541b2c;color:#fecdd3}
.success{background:#173d2a;color:#bbf7d0}
.hint{font-size:12px;color:#c4b5d5;margin-top:7px}
#confirmGroup[hidden]{display:none}
</style>
</head>
<body>
<div class="card">
 <div class="logo">VOID AI</div>
 <div class="subtitle" id="subtitle">Erstelle dein kostenloses Konto</div>

 <div class="tabs">
  <button type="button" id="registerTab" class="active">Registrieren</button>
  <button type="button" id="loginTab">Anmelden</button>
 </div>

 <form id="authForm">
  <div id="nameGroup">
   <label for="name">Name</label>
   <input id="name" type="text" autocomplete="name"
          placeholder="Dein Name" required>
  </div>

  <label for="email">E-Mail-Adresse</label>
  <input id="email" type="email" autocomplete="email"
         placeholder="name@beispiel.de" required>

  <label for="password">Passwort</label>
  <input id="password" type="password" minlength="8"
         autocomplete="new-password" placeholder="Mindestens 8 Zeichen" required>

  <div id="confirmGroup">
   <label for="confirmPassword">Passwort bestätigen</label>
   <input id="confirmPassword" type="password" minlength="8"
          autocomplete="new-password" placeholder="Passwort wiederholen" required>
   <div class="hint" id="passwordHint">Beide Passwörter müssen gleich sein.</div>
  </div>

  <button class="submit" id="submitButton" type="submit">Konto erstellen</button>
 </form>

 <div id="message" role="status" hidden></div>
</div>

<script>
"use strict";

/* DEINE SUPABASE-DATEN */
const SUPABASE_URL = "https://onewdrztvuffzxdnqmvi.supabase.co";
const SUPABASE_KEY = "sb_publishable_X74KchzYmRvLdl_wb0ISkQ_-PNOnJAA";

const $ = id => document.getElementById(id);

const form = $("authForm");
const nameInput = $("name");
const emailInput = $("email");
const passwordInput = $("password");
const confirmInput = $("confirmPassword");
const button = $("submitButton");
const message = $("message");
const passwordHint = $("passwordHint");

let mode = "register";
let client = null;

function showMessage(text, type) {
 message.textContent = text;
 message.className = type;
 message.hidden = false;
}

function clearMessage() {
 message.hidden = true;
 message.textContent = "";
}

function setMode(nextMode) {
 mode = nextMode;
 const registering = mode === "register";

 $("registerTab").classList.toggle("active", registering);
 $("loginTab").classList.toggle("active", !registering);
 $("nameGroup").hidden = !registering;
 $("confirmGroup").hidden = !registering;
 nameInput.required = registering;
 confirmInput.required = registering;
 passwordInput.autocomplete = registering
  ? "new-password" : "current-password";

 $("subtitle").textContent = registering
  ? "Erstelle dein kostenloses Konto"
  : "Melde dich bei deinem Konto an";

 button.textContent = registering ? "Konto erstellen" : "Anmelden";
 passwordHint.textContent = "Beide Passwörter müssen gleich sein.";
 clearMessage();
}

function checkPasswords() {
 confirmInput.setCustomValidity("");

 if (mode !== "register" || !confirmInput.value) {
  passwordHint.textContent = "Beide Passwörter müssen gleich sein.";
  passwordHint.style.color = "";
  return true;
 }

 if (passwordInput.value !== confirmInput.value) {
  confirmInput.setCustomValidity("Die Passwörter stimmen nicht überein.");
  passwordHint.textContent = "✖ Passwörter stimmen nicht überein.";
  passwordHint.style.color = "#fda4af";
  return false;
 }

 passwordHint.textContent = "✓ Passwörter stimmen überein.";
 passwordHint.style.color = "#86efac";
 return true;
}

passwordInput.addEventListener("input", checkPasswords);
confirmInput.addEventListener("input", checkPasswords);

$("registerTab").addEventListener("click", () => setMode("register"));
$("loginTab").addEventListener("click", () => setMode("login"));

function init() {
 if (!window.supabase || !window.supabase.createClient) {
  showMessage(
   "Supabase konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.",
   "error"
  );
  button.disabled = true;
  return;
 }

 try {
  client = window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY
  );
 } catch (error) {
  console.error(error);
  showMessage("Supabase konnte nicht gestartet werden.", "error");
  button.disabled = true;
 }
}

form.addEventListener("submit", async function(event) {
 event.preventDefault();
 clearMessage();

 if (!client) {
  showMessage("Supabase ist nicht verbunden. Lade die Seite neu.", "error");
  return;
 }

 const email = $("email").value.trim();
 const password = passwordInput.value;

 if (mode === "register") {
  if (nameInput.value.trim().length < 2) {
   showMessage("Bitte gib einen Namen mit mindestens 2 Zeichen ein.", "error");
   nameInput.focus();
   return;
  }

  if (password.length < 8) {
   showMessage("Dein Passwort muss mindestens 8 Zeichen haben.", "error");
   passwordInput.focus();
   return;
  }

  if (!checkPasswords()) {
   showMessage("Die beiden Passwörter stimmen nicht überein.", "error");
   confirmInput.reportValidity();
   confirmInput.focus();
   return;
  }
 }

 button.disabled = true;
 button.textContent = mode === "register"
  ? "Konto wird erstellt …" : "Anmeldung läuft …";

 try {
  if (mode === "register") {
   const {data, error} = await client.auth.signUp({
    email: email,
    password: password,
    options: {
     data: {
      name: nameInput.value.trim(),
      display_name: nameInput.value.trim()
     }
    }
   });

   if (error) throw error;

   if (data.session) {
    showMessage("Registrierung erfolgreich! Du bist angemeldet.", "success");
   } else {
    showMessage(
     "Registrierung angefragt. Falls E-Mail-Bestätigung aktiviert ist, bestätige deine E-Mail, bevor du dich anmeldest.",
     "success"
    );
   }
  } else {
   const {data, error} = await client.auth.signInWithPassword({
    email: email,
    password: password
   });

   if (error) throw error;

   if (data.user) {
    showMessage(
     "Anmeldung erfolgreich! Du bist als " +
     (data.user.user_metadata?.name || data.user.email) +
     " angemeldet.",
     "success"
    );
   }
  }
 } catch (error) {
  console.error("Supabase Auth:", error);

  const text = error.message || "Unbekannter Fehler.";

  if (/invalid login credentials/i.test(text)) {
   showMessage("E-Mail oder Passwort ist falsch. Prüfe deine Eingaben.", "error");
  } else if (/email not confirmed/i.test(text)) {
   showMessage("Deine E-Mail wurde noch nicht bestätigt. Prüfe dein Postfach.", "error");
  } else if (/already registered|already been registered/i.test(text)) {
   showMessage("Dieses Konto existiert möglicherweise bereits. Wechsle zu Anmelden.", "error");
  } else {
   showMessage("Supabase-Fehler: " + text, "error");
  }
 } finally {
  button.disabled = false;
  button.textContent = mode === "register" ? "Konto erstellen" : "Anmelden";
 }
});

init();
</script>
</body>
</html>
