
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091c">
<title>Void AI – Konto</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;color:#fff;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at top,#542080,#10091c 55%,#07050d);
}
.card{
 width:100%;max-width:430px;padding:30px;
 background:#171020;border:1px solid #7135a5;border-radius:22px;
 box-shadow:0 20px 80px #0008;
}
.logo{
 text-align:center;font-size:38px;font-weight:900;
 background:linear-gradient(90deg,#c084fc,#f0abfc);
 color:transparent;background-clip:text;margin-bottom:8px;
}
.subtitle{text-align:center;color:#c4b5d5;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button,.submit{
 padding:13px;border:0;border-radius:10px;
 background:#2b1b3b;color:white;font-weight:bold;cursor:pointer;
}
.tabs button{flex:1}
.tabs button.active,.submit{
 background:linear-gradient(100deg,#9333ea,#c026d3);
}
label{display:block;margin:15px 0 7px;font-size:14px}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #49365c;background:#0d0913;color:white;
 outline:none;font-size:16px;
}
input:focus{border-color:#c084fc}
.submit{width:100%;margin-top:22px;font-size:16px}
button:disabled{opacity:.6;cursor:wait}
#message{
 margin-top:16px;padding:12px;border-radius:9px;
 font-size:14px;line-height:1.5;overflow-wrap:anywhere;
}
.error{background:#541b2c;color:#fecdd3}
.success{background:#173d2a;color:#bbf7d0}
.info{background:#29203b;color:#e9d5ff}
.hint{font-size:12px;color:#c4b5d5;margin-top:8px}
[hidden]{display:none!important}
.footer{text-align:center;color:#9e8caf;font-size:12px;margin-top:20px}
</style>
</head>

<body>
<main class="card">
 <div class="logo">VOID AI</div>
 <div class="subtitle" id="subtitle">Erstelle dein kostenloses Konto</div>

 <div class="tabs">
  <button type="button" id="registerTab" class="active">Registrieren</button>
  <button type="button" id="loginTab">Anmelden</button>
 </div>

 <form id="authForm">
  <div id="nameGroup">
   <label for="name">Name</label>
   <input id="name" type="text" autocomplete="name"
    placeholder="Dein Name" required>
  </div>

  <label for="email">E-Mail-Adresse</label>
  <input id="email" type="email" autocomplete="email"
   placeholder="name@beispiel.de" required>

  <label for="password">Passwort</label>
  <input id="password" type="password" minlength="8"
   autocomplete="new-password" placeholder="Mindestens 8 Zeichen" required>

  <div id="confirmGroup">
   <label for="confirmPassword">Passwort bestätigen</label>
   <input id="confirmPassword" type="password" minlength="8"
    autocomplete="new-password" placeholder="Passwort wiederholen" required>
   <div class="hint" id="passwordHint">Beide Passwörter müssen gleich sein.</div>
  </div>

  <button class="submit" id="submitButton" type="submit">
   Konto erstellen
  </button>
 </form>

 <div id="message" class="info" role="status" aria-live="polite">
  Verbindung wird vorbereitet …
 </div>
 <div class="footer">Void AI · Dein Konto</div>
</main>

<script type="module">
import { createClient } from
 "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
 "https://onewdrztvuffzxdnqmvi.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_X74KchzYmRvLdl_wb0ISkQ_-PNOnJAA";

const $ = id => document.getElementById(id);

const form = $("authForm");
const nameInput = $("name");
const emailInput = $("email");
const passwordInput = $("password");
const confirmInput = $("confirmPassword");
const button = $("submitButton");
const message = $("message");

let mode = "register";
let client;

function showMessage(text, type = "info") {
 message.textContent = text;
 message.className = type;
 message.hidden = false;
}

function setMode(nextMode) {
 mode = nextMode;
 const registering = mode === "register";

 $("registerTab").classList.toggle("active", registering);
 $("loginTab").classList.toggle("active", !registering);

 $("nameGroup").hidden = !registering;
 $("confirmGroup").hidden = !registering;

 nameInput.required = registering;
 confirmInput.required = registering;

 passwordInput.autocomplete =
  registering ? "new-password" : "current-password";

 $("subtitle").textContent = registering
  ? "Erstelle dein kostenloses Konto"
  : "Willkommen zurück bei Void AI";

 button.textContent = registering ? "Konto erstellen" : "Anmelden";
 showMessage(
  registering
   ? "Gib deine Daten ein, um ein Konto zu erstellen."
   : "Gib deine E-Mail-Adresse und dein Passwort ein."
 );
}

$("registerTab").addEventListener("click", () => setMode("register"));
$("loginTab").addEventListener("click", () => setMode("login"));

function checkPasswords() {
 confirmInput.setCustomValidity("");

 if (mode !== "register") return true;

 if (passwordInput.value !== confirmInput.value) {
  confirmInput.setCustomValidity("Die Passwörter stimmen nicht überein.");
  $("passwordHint").textContent = "Die Passwörter stimmen nicht überein.";
  $("passwordHint").style.color = "#fda4af";
  return false;
 }

 $("passwordHint").textContent = "Die Passwörter stimmen überein.";
 $("passwordHint").style.color = "#86efac";
 return true;
}

passwordInput.addEventListener("input", checkPasswords);
confirmInput.addEventListener("input", checkPasswords);

function friendlyError(error) {
 const text = error?.message || "Unbekannter Fehler.";

 if (/invalid login credentials/i.test(text))
  return "E-Mail oder Passwort ist falsch.";

 if (/email not confirmed/i.test(text))
  return "Deine E-Mail ist noch nicht bestätigt. Prüfe dein Postfach.";

 if (/already registered|already been registered/i.test(text))
  return "Diese E-Mail ist bereits registriert. Wähle Anmelden.";

 if (/password should be at least/i.test(text))
  return "Dein Passwort ist zu kurz.";

 if (/failed to fetch|networkerror|fetch failed/i.test(text))
  return "Keine Verbindung zu Supabase. Prüfe dein Internet und lade die Seite neu.";

 return "Supabase meldet: " + text;
}

form.addEventListener("submit", async event => {
 event.preventDefault();

 if (!client) {
  showMessage("Supabase ist nicht bereit. Lade die Seite neu.", "error");
  return;
 }

 const email = emailInput.value.trim();
 const password = passwordInput.value;

 if (mode === "register") {
  if (nameInput.value.trim().length < 2) {
   showMessage("Bitte gib einen Namen mit mindestens 2 Zeichen ein.", "error");
   nameInput.focus();
   return;
  }

  if (password.length < 8) {
   showMessage("Das Passwort muss mindestens 8 Zeichen haben.", "error");
   passwordInput.focus();
   return;
  }

  if (!checkPasswords()) {
   showMessage("Die beiden Passwörter sind nicht gleich.", "error");
   confirmInput.focus();
   return;
  }
 }

 button.disabled = true;
 button.textContent = mode === "register"
  ? "Konto wird erstellt …"
  : "Anmeldung läuft …";

 showMessage("Anfrage wird gesendet …");

 try {
  if (mode === "register") {
   const { data, error } = await client.auth.signUp({
    email,
    password,
    options: {
     data: {
      name: nameInput.value.trim(),
      display_name: nameInput.value.trim()
     }
    }
   });

   if (error) throw error;

   if (data.session) {
    showMessage(
     "Konto erfolgreich erstellt! Du bist jetzt angemeldet.",
     "success"
    );
   } else {
    showMessage(
     "Registrierung erfolgreich angefragt! Falls E-Mail-Bestätigung in Supabase aktiviert ist, bestätige zuerst deine E-Mail. Danach kannst du dich anmelden.",
     "success"
    );
   }
  } else {
   const { data, error } = await client.auth.signInWithPassword({
    email,
    password
   });

   if (error) throw error;

   if (data.user) {
    showMessage(
     "Erfolgreich angemeldet! Willkommen bei Void AI, " +
     (data.user.user_metadata?.name || data.user.email) + ".",
     "success"
    );
   } else {
    showMessage("Anmeldung nicht abgeschlossen. Bitte versuche es erneut.", "error");
   }
  }
 } catch (error) {
  console.error("Void AI Anmeldung:", error);
  showMessage(friendlyError(error), "error");
 } finally {
  button.disabled = false;
  button.textContent = mode === "register" ? "Konto erstellen" : "Anmelden";
 }
});

try {
 client = createClient(SUPABASE_URL, SUPABASE_KEY);
 showMessage("Verbindung bereit. Du kannst dich registrieren oder anmelden.", "success");
} catch (error) {
 console.error(error);
 showMessage("Supabase konnte nicht gestartet werden: " + (error.message || error), "error");
 button.disabled = true;
}
</script>
</body>
</html>
