
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090611;color:#f8f5ff;font-family:Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#9333ea;color:white;font-weight:bold}
button:hover{filter:brightness(1.15)}
input,textarea{width:100%;padding:14px;margin:7px 0 13px;border:1px solid #352449;border-radius:12px;background:#100b1a;color:white;outline:none}
input:focus,textarea:focus{border-color:#a855f7}
label{font-size:14px;color:#d8c6ec}
.hidden{display:none!important}
.muted{color:#a99ab9;font-size:13px}
.purple{color:#c084fc}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:410px;padding:30px;background:#130d20;border:1px solid #382347;border-radius:22px;box-shadow:0 0 50px #7e22ce18}
.logo{text-align:center;font-size:32px;font-weight:900;color:#c084fc;margin-bottom:8px}
.subtitle{text-align:center;color:#aa9bbd;margin-bottom:28px}
.auth-card h2{margin:0 0 20px;text-align:center}
.full{width:100%}
.switch{text-align:center;margin-top:18px;color:#b8a7ca;font-size:14px}
.switch a{color:#c084fc;cursor:pointer}
#error{color:#fca5a5;font-size:13px;line-height:1.5;margin:8px 0}
#status{color:#c084fc;font-size:13px;min-height:0;margin:5px 0}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;flex-shrink:0;background:#100b19;border-right:1px solid #2b1c39;padding:18px;display:flex;flex-direction:column;gap:12px}
.brand{font-size:23px;font-weight:900;color:#c084fc;padding:8px 0 15px}
.secondary{background:#21152d;border:1px solid #392747}
#chatList{display:flex;flex-direction:column;gap:7px}
.chat-item{background:#1a1124;text-align:left;font-weight:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbox{margin-top:auto;border-top:1px solid #352449;padding-top:14px;overflow-wrap:anywhere}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{padding:17px 22px;border-bottom:1px solid #261a32;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top strong{color:#d8b4fe}
.messages{flex:1;width:100%;max-width:850px;margin:0 auto;padding:25px 20px;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto;max-width:450px;padding:25px 0}
.sphere{width:100px;height:100px;border-radius:50%;margin:0 auto 25px;background:radial-gradient(circle at 30% 25%,#e9d5ff,#a855f7 22%,#581c87 48%,#13051f 75%);box-shadow:0 0 35px #9333ea70, inset -10px -12px 25px #05020a;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px);box-shadow:0 0 55px #9333eaa0}}
.msg{padding:15px 17px;border-radius:16px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.msg.user{align-self:flex-end;background:#51217b}
.msg.ai{align-self:flex-start;background:#171020;border:1px solid #33223f}
.msg small{display:block;color:#bca9cf;margin-top:10px}
.composer{position:sticky;bottom:0;background:#090611;padding:12px 18px 18px}
.compose-inner{max-width:810px;margin:auto;background:#130d20;border:1px solid #382449;border-radius:17px;padding:10px}
#prompt{resize:none;border:0;background:transparent;margin:0;min-height:45px;max-height:160px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.actions-left,.actions-right{display:flex;gap:8px;align-items:center}
.smallbtn{padding:9px 12px}
@media(max-width:650px){
 .sidebar{width:66px;padding:10px;align-items:center}
 .brand{font-size:16px}
 .sidebar .side-label,.sidebar #chatList,.sidebar .userbox .email{display:none}
 .sidebar button{padding:10px 7px;font-size:12px}
 .userbox{width:100%;text-align:center}
 .top{padding:13px}
 .messages{padding:18px 12px}
 .composer{padding:10px}
 .msg{max-width:96%}
}
</style>
</head>
<body>

<section id="authScreen" class="center">
 <div class="auth-card">
  <div class="logo">VOID AI</div>
  <div class="subtitle">Deine KI. Deine Welt.</div>

  <form id="registerForm">
   <h2>Konto erstellen</h2>
   <label for="regName">Name</label>
   <input id="regName" autocomplete="name" placeholder="Dein Name" required maxlength="60">

   <label for="regEmail">E-Mail-Adresse</label>
   <input id="regEmail" type="email" autocomplete="email" placeholder="E-Mail-Adresse" required>

   <label for="regPassword">Passwort</label>
   <input id="regPassword" type="password" autocomplete="new-password" placeholder="Passwort" minlength="6" required>

   <label for="regConfirm">Passwort bestätigen</label>
   <input id="regConfirm" type="password" autocomplete="new-password" placeholder="Passwort bestätigen" minlength="6" required>

   <button class="full" type="submit">Konto erstellen</button>
   <div class="switch">Schon ein Konto? <a id="showLogin">Anmelden</a></div>
  </form>

  <form id="loginForm" class="hidden">
   <h2>Anmelden</h2>
   <label for="loginEmail">E-Mail-Adresse</label>
   <input id="loginEmail" type="email" autocomplete="email" placeholder="E-Mail-Adresse" required>

   <label for="loginPassword">Passwort</label>
   <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Passwort" required>

   <button class="full" type="submit">Anmelden</button>
   <div class="switch">Noch kein Konto? <a id="showRegister">Registrieren</a></div>
  </form>

  <div id="error" role="status"></div>
  <div id="status"></div>
 </div>
</section>

<section id="appScreen" class="app hidden">
 <aside class="sidebar">
  <div class="brand">VOID<span class="side-label"> AI</span></div>
  <button id="newChat" class="full">＋ <span class="side-label">Neuer Chat</span></button>
  <div class="side-label muted">DEINE CHATS</div>
  <div id="chatList"></div>
  <div class="userbox">
   <div id="userName" class="purple"></div>
   <div id="userEmail" class="email muted"></div>
   <button id="logout" class="secondary full" style="margin-top:12px">Abmelden</button>
  </div>
 </aside>

 <main class="main">
  <header class="top">
   <strong>✦ Void AI</strong>
   <span class="muted">Dein KI-Assistent</span>
  </header>
  <div id="messages" class="messages">
   <div class="welcome" id="welcome">
    <div class="sphere"></div>
    <h2>Willkommen bei <span class="purple">Void AI</span></h2>
    <p class="muted">Was möchtest du heute wissen?</p>
   </div>
  </div>
  <div class="composer">
   <div class="compose-inner">
    <textarea id="prompt" rows="1" placeholder="Frag Void AI etwas..." aria-label="Deine Nachricht"></textarea>
    <div class="actions">
     <div class="actions-left">
      <button id="voiceBtn" class="secondary smallbtn" title="Spracheingabe" aria-label="Spracheingabe">🎙</button>
      <span id="micStatus" class="muted"></span>
     </div>
     <div class="actions-right">
      <button id="sendBtn" class="smallbtn">Senden ↑</button>
     </div>
    </div>
   </div>
   <p class="muted" style="text-align:center">Void AI kann Fehler machen. Überprüfe wichtige Antworten.</p>
  </div>
 </main>
</section>

<script>
/* 1. HIER DEINE SUPABASE DATEN EINTRAGEN */
const SUPABASE_URL = "https://onewdrztvuffzxdnqmvi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_X74KchzYmRvLdl_wb0ISkQ_-PNOnJAA";

/* Deine vorhandene KI-Verbindung bleibt unverändert. */
const AI_ENDPOINT = "https://void-ai-api.cguerpinar.workers.dev/";

const $ = id => document.getElementById(id);
const supabaseReady =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("DEINE_") &&
  !SUPABASE_ANON_KEY.includes("DEIN_");

let db = null;
let currentUser = null;
let recognition = null;
let activeChatId = null;
let chats = [];

function setError(message="") {
  $("error").textContent = message;
}
function setStatus(message="") {
  $("status").textContent = message;
}
function showRegister() {
  $("registerForm").classList.remove("hidden");
  $("loginForm").classList.add("hidden");
  setError();
  setStatus();
}
function showLogin() {
  $("loginForm").classList.remove("hidden");
  $("registerForm").classList.add("hidden");
  setError();
  setStatus();
}
$("showLogin").onclick = showLogin;
$("showRegister").onclick = showRegister;

function friendlyError(error) {
  const msg = error?.message || "Unbekannter Fehler.";
  if (/invalid login credentials/i.test(msg)) return "E-Mail oder Passwort ist falsch.";
  if (/already registered/i.test(msg)) return "Diese E-Mail ist bereits registriert. Melde dich an.";
  if (/email not confirmed/i.test(msg)) return "Bitte bestätige zuerst deine E-Mail-Adresse.";
  return msg;
}

$("registerForm").onsubmit = async event => {
  event.preventDefault();
  setError();
  if (!db) return setError("Trage zuerst deine Supabase-URL und deinen Schlüssel im Code ein.");

  const name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;
  const confirm = $("regConfirm").value;

  if (password !== confirm) return setError("Die Passwörter stimmen nicht überein.");
  if (password.length < 6) return setError("Das Passwort muss mindestens 6 Zeichen haben.");
  if (!name) return setError("Bitte gib deinen Namen ein.");

  setStatus("Konto wird erstellt...");
  const {data, error} = await db.auth.signUp({
    email,
    password,
    options: {data: {name}}
  });

  if (error) {
    setStatus();
    return setError(friendlyError(error));
  }

  if (data.session) {
    currentUser = data.user;
    await enterApp();
  } else {
    setStatus();
    setError("Konto erstellt! Prüfe deine E-Mails und bestätige deine Adresse. Danach kannst du dich anmelden.");
    showLogin();
  }
};

$("loginForm").onsubmit = async event => {
  event.preventDefault();
  setError();
  if (!db) return setError("Trage zuerst deine Supabase-URL und deinen Schlüssel im Code ein.");

  setStatus("Anmeldung läuft...");
  const {data, error} = await db.auth.signInWithPassword({
    email: $("loginEmail").value.trim(),
    password: $("loginPassword").value
  });

  if (error) {
    setStatus();
    return setError(friendlyError(error));
  }
  currentUser = data.user;
  await enterApp();
};

async function enterApp() {
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("userName").textContent =
    currentUser?.user_metadata?.name || currentUser?.email || "Void Nutzer";
  $("userEmail").textContent = currentUser?.email || "";
  setError();
  setStatus();
  loadChats();
}

$("logout").onclick = async () => {
  if (db) await db.auth.signOut();
  currentUser = null;
  chats = [];
  activeChatId = null;
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("prompt").value = "";
  $("micStatus").textContent = "";
  showLogin();
};

function loadChats() {
  try {
    const saved = JSON.parse(localStorage.getItem("void_ai_2_chats") || "[]");
    const uid = currentUser?.id;
    chats = saved.filter(c => c.owner === uid);
  } catch { chats = []; }

  if (!chats.length) createChat();
  else {
    activeChatId = chats[0].id;
    renderChatList();
    renderMessages();
  }
}
function saveChats() {
  try {
    const saved = JSON.parse(localStorage.getItem("void_ai_2_chats") || "[]");
    const others = saved.filter(c => c.owner !== currentUser?.id);
    localStorage.setItem("void_ai_2_chats", JSON.stringify([...others, ...chats]));
  } catch {}
}
function createChat() {
  const chat = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    owner: currentUser?.id,
    title: "Neuer Chat",
    messages: []
  };
  chats.unshift(chat);
  activeChatId = chat.id;
  saveChats();
  renderChatList();
  renderMessages();
}
function activeChat() {
  return chats.find(c => c.id === activeChatId);
}
function renderChatList() {
  const list = $("chatList");
  list.replaceChildren();
  chats.forEach(chat => {
    const button = document.createElement("button");
    button.className = "chat-item";
    button.textContent = chat.title || "Neuer Chat";
    button.style.outline = chat.id === activeChatId ? "1px solid #a855f7" : "none";
    button.onclick = () => {
      activeChatId = chat.id;
      renderChatList();
      renderMessages();
    };
    list.appendChild(button);
  });
}
function addMessage(role, content) {
  const chat = activeChat();
  if (!chat) return;
  chat.messages.push({role, content});
  if (role === "user" && chat.messages.filter(m => m.role === "user").length === 1) {
    chat.title = content.slice(0, 32) || "Neuer Chat";
  }
  saveChats();
  renderChatList();
  renderMessages();
}
function renderMessages() {
  const container = $("messages");
  container.replaceChildren();
  const chat = activeChat();

  if (!chat || !chat.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    const sphere = document.createElement("div");
    sphere.className = "sphere";
    const heading = document.createElement("h2");
    heading.append("Willkommen bei ");
    const purple = document.createElement("span");
    purple.className = "purple";
    purple.textContent = "Void AI";
    heading.appendChild(purple);
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "Was möchtest du heute wissen?";
    welcome.append(sphere, heading, p);
    container.appendChild(welcome);
    return;
  }

  chat.messages.forEach(message => {
    const bubble = document.createElement("div");
    bubble.className = "msg " + (message.role === "user" ? "user" : "ai");
    bubble.textContent = message.content;
    if (message.role === "assistant") {
      const copy = document.createElement("button");
      copy.className = "secondary smallbtn";
      copy.style.marginTop = "10px";
      copy.textContent = "Kopieren";
      copy.onclick = () => navigator.clipboard?.writeText(message.content);
      const speak = document.createElement("button");
      speak.className = "secondary smallbtn";
      speak.style.margin = "10px 0 0 7px";
      speak.textContent = "Vorlesen";
      speak.onclick = () => {
        if ("speechSynthesis" in window) {
          speechSynthesis.cancel();
          speechSynthesis.speak(new SpeechSynthesisUtterance(message.content));
        }
      };
      bubble.append(document.createElement("br"), copy, speak);
    }
    container.appendChild(bubble);
  });
  container.scrollTop = container.scrollHeight;
}

$("newChat").onclick = createChat;
$("prompt").addEventListener("input", () => {
  $("prompt").style.height = "auto";
  $("prompt").style.height = Math.min($("prompt").scrollHeight, 160) + "px";
});

async function sendMessage() {
  const prompt = $("prompt");
  const message = prompt.value.trim();
  if (!message) return;

  prompt.value = "";
  prompt.style.height = "auto";
  addMessage("user", message);
  $("sendBtn").disabled = true;
  $("sendBtn").textContent = "…";

  try {
    const response = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Die KI-Anfrage ist fehlgeschlagen.");

    const reply = data.reply || data.response || data.message;
    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("Die KI hat keine Antwort zurückgegeben.");
    }
    addMessage("assistant", reply);
  } catch (error) {
    addMessage("assistant", "Verbindung fehlgeschlagen: " + (error.message || "Bitte versuche es erneut."));
  } finally {
    $("sendBtn").disabled = false;
    $("sendBtn").textContent = "Senden ↑";
  }
}
$("sendBtn").onclick = sendMessage;
$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("voiceBtn").onclick = () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    $("micStatus").textContent = "Spracheingabe nicht unterstützt";
    return;
  }
  if (recognition) {
    recognition.stop();
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "de-DE";
  recognition.onstart = () => $("micStatus").textContent = "🎙 Ich höre zu…";
  recognition.onresult = event => {
    $("prompt").value += ($("prompt").value ? " " : "") + event.results[0][0].transcript;
    $("prompt").dispatchEvent(new Event("input"));
  };
  recognition.onerror = () => $("micStatus").textContent = "";
  recognition.onend = () => {
    recognition = null;
    $("micStatus").textContent = "";
  };
  recognition.start();
};

async function init() {
  if (!supabaseReady) {
    setError("Fast fertig! Trage deine Supabase-URL und deinen Publishable/Anon Key im Code ein.");
    return;
  }

  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const {data, error} = await db.auth.getSession();
  if (error) {
    setError("Supabase-Verbindung fehlgeschlagen: " + error.message);
    return;
  }
  if (data.session) {
    currentUser = data.session.user;
    await enterApp();
  }
  db.auth.onAuthStateChange((_event, session) => {
    if (session && !currentUser) {
      currentUser = session.user;
      enterApp();
    }
  });
}
init();
</script>
</body>
</html>
