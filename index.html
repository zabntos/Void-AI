
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090711">
<title>Void AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  color-scheme: dark;
  --bg:#090711;
  --panel:#120e1d;
  --panel2:#1b142a;
  --purple:#9c65ff;
  --purple2:#713ce0;
  --text:#f7f2ff;
  --muted:#a99bbd;
  --border:#342445;
  --danger:#ff91ad;
  --success:#a6f0c0;
}
* {box-sizing:border-box}
body {
  margin:0; min-height:100dvh; background:
    radial-gradient(ellipse at 50% -20%,#442366 0,transparent 55%),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
button,input,textarea {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.55;cursor:not-allowed}
.hidden {display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid var(--purple);outline-offset:2px
}
.btn {
  border:1px solid var(--border);background:var(--panel2);color:var(--text);
  padding:11px 14px;border-radius:12px
}
.btn:hover:not(:disabled) {border-color:var(--purple)}
.primary {
  border:0;background:linear-gradient(135deg,#a66cff,#713ce0);
  box-shadow:0 5px 22px #8846ed30
}
.brand {display:flex;align-items:center;gap:12px}
.logo {
  width:45px;height:45px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(145deg,#c59aff,#7338dc);
  box-shadow:0 0 28px #8e4aff35;font-size:25px;flex-shrink:0
}
.brand-title {font-weight:850;font-size:21px;letter-spacing:-.6px}
.muted {color:var(--muted)}
.small {font-size:12px}
.gradient {
  background:linear-gradient(90deg,#fff,#d3b2ff,#9c65ff);
  color:transparent;background-clip:text;-webkit-background-clip:text
}

/* Anmeldung */
.auth-screen {
  min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:radial-gradient(ellipse at 50% 0,#462568 0,transparent 58%),var(--bg)
}
.auth-card {
  width:100%;max-width:420px;padding:30px;
  background:#110d1cf5;border:1px solid var(--border);
  border-radius:24px;box-shadow:0 24px 90px #0005
}
.auth-brand{text-align:center;margin-bottom:26px}
.auth-brand .logo{margin:0 auto 13px}
.auth-brand h1{font-size:29px;margin:0}
.auth-brand p{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.tab {
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:12px;border-radius:12px
}
.tab.active{background:#9c65ff1c;border-color:#9c65ff70;color:white}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;margin-bottom:7px;color:#ded3ee}
.field input {
  display:block;width:100%;min-height:46px;padding:12px;
  border:1px solid var(--border);border-radius:11px;
  background:#0a0811;color:white
}
.field input:focus{border-color:var(--purple);outline:none}
#authSubmit{width:100%;margin-top:6px;min-height:47px}
#authMessage{font-size:13px;line-height:1.6;overflow-wrap:anywhere;margin-top:15px}
.error{color:var(--danger)}
.success{color:var(--success)}
.link-btn {
  display:block;margin:12px auto 0;border:0;background:transparent;
  color:#c8a9ff;font-size:12px;padding:8px
}
.attribution{color:#716580;text-align:center;font-size:10px;margin-top:20px}

/* Chat */
.app{min-height:100dvh;display:flex}
.sidebar {
  width:255px;flex-shrink:0;border-right:1px solid var(--border);
  background:#0b0812eF;padding:22px 14px;display:flex;flex-direction:column;gap:18px
}
.sidebar .brand{padding:0 6px 10px}
.new-chat{width:100%;text-align:left}
.section-label {
  color:#887b9a;font-size:10px;text-transform:uppercase;
  letter-spacing:1.5px;padding:0 8px
}
.history{display:flex;flex-direction:column;gap:5px;overflow:auto}
.history button {
  text-align:left;background:transparent;color:#d7cce6;border:1px solid transparent;
  border-radius:10px;padding:11px;font-size:12px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis
}
.history button.active,.history button:hover{background:var(--panel2);border-color:var(--border)}
.side-bottom{margin-top:auto;display:grid;gap:8px}
.side-bottom .btn{width:100%;text-align:left}
.main{min-width:0;flex:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar {
  min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 24px;border-bottom:1px solid var(--border);
  background:#0b0813d9;position:sticky;top:0;z-index:4;backdrop-filter:blur(14px)
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title{font-weight:750;font-size:14px}
.status{font-size:11px;color:var(--muted);margin-top:3px}
.account{display:flex;align-items:center;gap:9px;min-width:0}
.account-email{font-size:11px;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.mobile-menu{display:none}
.messages {
  width:100%;max-width:900px;margin:0 auto;padding:30px 24px;
  display:flex;flex-direction:column;gap:22px;flex:1
}
.welcome{text-align:center;margin:auto 0;padding:30px 0}
.planet {
  position:relative;width:95px;height:95px;border-radius:50%;margin:0 auto 28px;
  display:grid;place-items:center;font-size:51px;
  background:radial-gradient(circle at 30% 25%,#e2caff,#9857f2 50%,#39205c);
  box-shadow:0 0 65px #9c65ff30
}
.planet:after {
  content:"";position:absolute;width:128px;height:32px;border:4px solid #d1adff;
  border-left-color:#8750d4;border-right-color:#a36cff;border-radius:50%;
  transform:rotate(-24deg)
}
.welcome h1{font-size:clamp(28px,5vw,43px);letter-spacing:-1.4px;margin:0 0 12px}
.welcome p{font-size:13px;line-height:1.8;color:var(--muted)}
.suggestions {
  max-width:610px;margin:25px auto 0;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
.suggestion {
  padding:14px;text-align:left;background:#ffffff05;border:1px solid var(--border);
  border-radius:14px;color:#eee5fa;font-size:12px
}
.suggestion:hover{background:#9c65ff13;border-color:#9c65ff70}
.suggestion span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.message{display:flex;gap:11px;align-items:flex-start;max-width:100%}
.message.user{flex-direction:row-reverse}
.avatar {
  flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--border);border-radius:11px;background:var(--panel2)
}
.message.user .avatar{background:#4e2c82}
.bubble{max-width:calc(100% - 45px);min-width:0}
.bubble-content {
  padding:13px 15px;background:#151020;border:1px solid var(--border);
  border-radius:4px 15px 15px 15px;white-space:pre-wrap;
  overflow-wrap:anywhere;font-size:14px;line-height:1.75
}
.message.user .bubble-content {
  background:linear-gradient(135deg,#4b2b79,#302044);border-radius:15px 4px 15px 15px
}
.bubble-actions{display:flex;gap:8px;margin-top:6px}
.mini {
  border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px
}
.mini:hover{color:white}
.composer-wrap{width:100%;max-width:900px;margin:0 auto;padding:0 24px 14px}
.composer {
  border:1px solid #8052b84d;border-radius:19px;padding:9px;
  background:#151020;box-shadow:0 0 35px #9c65ff09
}
.composer textarea {
  display:block;width:100%;min-height:44px;max-height:180px;resize:none;
  padding:10px;border:0;outline:0;background:transparent;color:white;
  font-size:16px;line-height:1.5
}
.composer textarea::placeholder{color:#9184a1}
.composer-bottom{display:flex;align-items:center;gap:7px}
.icon-btn{min-height:38px;min-width:39px;padding:7px;border-radius:11px}
.hint{font-size:10px;color:#81758f;margin-right:auto;padding-left:7px}
.send{height:41px;width:43px;border-radius:12px;font-size:18px}
.footer{text-align:center;color:#716580;font-size:10px;padding:0 10px 14px}
.typing{font-size:12px;color:var(--muted);padding:8px}

@media(max-width:720px) {
  .sidebar {
    position:fixed;top:0;bottom:0;left:0;z-index:20;
    transform:translateX(-105%);transition:transform .22s;
    box-shadow:20px 0 60px #0008
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:block;padding:9px 11px}
  .topbar{min-height:60px;padding:10px 12px}
  .account-email{max-width:90px}
  .messages{padding:18px 13px;gap:17px}
  .welcome{padding:20px 0}
  .planet{width:82px;height:82px;font-size:44px}
  .planet:after{width:110px;height:28px}
  .suggestions{gap:8px;margin-top:20px}
  .suggestion{padding:11px}
  .composer-wrap{padding:0 10px 10px}
  .hint{display:none}
  .auth-card{padding:24px 19px}
}
@media(max-width:350px) {
  .suggestions{grid-template-columns:1fr}
  .account-email{display:none}
}
</style>
</head>

<body>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">🪐</div>
      <h1 class="gradient">Void AI</h1>
      <p>Deine KI. Deine Welt.</p>
    </div>

    <div class="tabs">
      <button id="loginTab" class="tab active" type="button">Anmelden</button>
      <button id="registerTab" class="tab" type="button">Registrieren</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="field hidden">
        <label for="displayName">Dein Name</label>
        <input id="displayName" type="text" maxlength="60" autocomplete="name" placeholder="Dein Name">
      </div>
      <div class="field">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" type="email" autocomplete="email" required placeholder="du@beispiel.de">
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Mindestens 6 Zeichen">
      </div>
      <div id="confirmField" class="field hidden">
        <label for="confirmPassword">Passwort bestätigen</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Passwort wiederholen">
      </div>
      <button id="authSubmit" class="btn primary" type="submit">Anmelden</button>
      <button id="forgotPassword" class="link-btn" type="button">Passwort vergessen?</button>
      <div id="authMessage" role="status" aria-live="polite"></div>
    </form>
    <div class="attribution">Created by Zabntos with OpenAI</div>
  </div>
</section>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="logo">🪐</div>
      <div><div class="brand-title">Void AI</div><div class="muted small">Deine KI. Deine Welt.</div></div>
    </div>
    <button id="newChat" class="btn primary new-chat" type="button">＋ Neuer Chat</button>
    <div class="section-label">Deine Chats</div>
    <div id="history" class="history"></div>
    <div class="side-bottom">
      <button id="clearChats" class="btn" type="button">Chatverlauf löschen</button>
      <button id="logout" class="btn" type="button">Abmelden</button>
      <div class="attribution">Created by Zabntos with OpenAI</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button id="menuBtn" class="btn mobile-menu" type="button" aria-label="Menü">☰</button>
        <div><div class="topbar-title">Void AI ✦</div><div id="status" class="status">Bereit für deine Fragen</div></div>
      </div>
      <div class="account">
        <span id="userEmail" class="account-email"></span>
        <button id="topLogout" class="btn small" type="button">Abmelden</button>
      </div>
    </header>

    <section id="messages" class="messages"></section>

    <div class="composer-wrap">
      <form id="chatForm" class="composer">
        <textarea id="prompt" rows="1" maxlength="12000" aria-label="Nachricht" placeholder="Schreib eine Nachricht an Void AI …"></textarea>
        <div class="composer-bottom">
          <button id="voiceBtn" class="btn icon-btn" type="button" title="Spracheingabe">🎙️</button>
          <button id="readBtn" class="btn icon-btn" type="button" title="Letzte Antwort vorlesen">🔊</button>
          <span class="hint">Enter senden · Shift + Enter neue Zeile</span>
          <button id="sendBtn" class="btn primary send" type="submit" aria-label="Senden">➤</button>
        </div>
      </form>
    </div>
    <footer class="footer">Void AI kann Fehler machen. Überprüfe wichtige Antworten.</footer>
  </main>
</div>

<script>
(() => {
"use strict";

/* Deine Konfiguration */
const SUPABASE_URL = "https://onewdrztvuffzxdnqmvi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_X74KchzYmRvLdl_wb0ISkQ_-PNOnJAA";
const AI_ENDPOINT = "https://void-ai-api.cguerpinar.workers.dev/";

const $ = id => document.getElementById(id);
const authScreen = $("authScreen");
const app = $("app");
const authForm = $("authForm");
const authSubmit = $("authSubmit");
const authMessage = $("authMessage");
const messages = $("messages");
const promptInput = $("prompt");

let client = null;
let user = null;
let authMode = "login";
let authBusy = false;
let chatBusy = false;
let chats = [];
let currentChatId = null;
let lastAnswer = "";
let recognition = null;
let listening = false;
let authGeneration = 0;

function showAuthMessage(text, kind = "") {
  authMessage.textContent = text;
  authMessage.className = kind;
}

function setAuthMode(mode) {
  authMode = mode;
  const registering = mode === "register";

  $("loginTab").classList.toggle("active", !registering);
  $("registerTab").classList.toggle("active", registering);
  $("nameField").classList.toggle("hidden", !registering);
  $("confirmField").classList.toggle("hidden", !registering);
  $("forgotPassword").classList.toggle("hidden", registering);

  $("displayName").required = registering;
  $("confirmPassword").required = registering;
  $("password").autocomplete = registering ? "new-password" : "current-password";
  authSubmit.textContent = registering ? "Konto erstellen" : "Anmelden";
  showAuthMessage("");
}

$("loginTab").addEventListener("click", () => setAuthMode("login"));
$("registerTab").addEventListener("click", () => setAuthMode("register"));

function displayAuth() {
  authScreen.classList.remove("hidden");
  app.classList.add("hidden");
}

function displayApp(nextUser) {
  user = nextUser;
  authScreen.classList.add("hidden");
  app.classList.remove("hidden");
  $("userEmail").textContent = user.email || "";
  loadChats();
  renderHistory();
  renderMessages();
}

function storageKey() {
  return user ? "void_ai_2_chats_" + user.id : null;
}

function loadChats() {
  try {
    const parsed = JSON.parse(localStorage.getItem(storageKey()) || "[]");
    chats = Array.isArray(parsed) ? parsed.filter(c =>
      c && typeof c.id === "string" && Array.isArray(c.messages)
    ) : [];
  } catch {
    chats = [];
  }
  chats.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  currentChatId = chats.length ? chats[0].id : null;
}

function saveChats() {
  if (!storageKey()) return;
  try {
    chats = chats.slice(0, 60);
    localStorage.setItem(storageKey(), JSON.stringify(chats));
  } catch {
    $("status").textContent = "Chatverlauf konnte nicht gespeichert werden";
  }
}

function activeChat() {
  return chats.find(c => c.id === currentChatId) || null;
}

function makeId() {
  return window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function newChat() {
  if (chatBusy) return;
  const chat = {id:makeId(),title:"Neuer Chat",messages:[],updatedAt:Date.now()};
  chats.unshift(chat);
  currentChatId = chat.id;
  saveChats();
  renderHistory();
  renderMessages();
  $("sidebar").classList.remove("open");
  promptInput.focus();
}

$("newChat").addEventListener("click", newChat);

function renderHistory() {
  const root = $("history");
  root.replaceChildren();

  if (!chats.length) {
    const empty = document.createElement("div");
    empty.className = "section-label";
    empty.textContent = "Noch keine Chats";
    root.append(empty);
    return;
  }

  chats.slice(0, 40).forEach(chat => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = chat.title || "Neuer Chat";
    button.title = button.textContent;
    button.classList.toggle("active", chat.id === currentChatId);
    button.addEventListener("click", () => {
      if (chatBusy) return;
      currentChatId = chat.id;
      renderHistory();
      renderMessages();
      $("sidebar").classList.remove("open");
    });
    root.append(button);
  });
}

function makeMessage(message) {
  const row = document.createElement("article");
  row.className = "message " + (message.role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = message.role === "user" ? "👤" : "🪐";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const content = document.createElement("div");
  content.className = "bubble-content";
  content.textContent = message.content || "";
  bubble.append(content);

  if (message.role === "assistant" && message.content) {
    const actions = document.createElement("div");
    actions.className = "bubble-actions";

    const copy = document.createElement("button");
    copy.className = "mini";
    copy.type = "button";
    copy.textContent = "Kopieren";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(message.content);
        copy.textContent = "Kopiert ✓";
      } catch {
        copy.textContent = "Kopieren nicht möglich";
      }
    });

    const read = document.createElement("button");
    read.className = "mini";
    read.type = "button";
    read.textContent = "🔊 Vorlesen";
    read.addEventListener("click", () => speak(message.content));

    actions.append(copy, read);
    bubble.append(actions);
  }

  row.append(avatar, bubble);
  return row;
}

function renderWelcome() {
  const wrap = document.createElement("div");
  wrap.className = "welcome";

  const planet = document.createElement("div");
  planet.className = "planet";
  planet.textContent = "🪐";

  const heading = document.createElement("h1");
  heading.append("Willkommen bei ");
  const name = document.createElement("span");
  name.className = "gradient";
  name.textContent = "Void AI";
  heading.append(name);

  const description = document.createElement("p");
  description.append("Was möchtest du heute wissen?");
  description.append(document.createElement("br"));
  description.append("Frag mich etwas oder entwickle eine neue Idee.");

  const suggestions = document.createElement("div");
  suggestions.className = "suggestions";

  const items = [
    ["✦ Etwas lernen","Wissen einfach erklärt","Erkläre mir ein spannendes wissenschaftliches Thema."],
    ["✧ Ideen entwickeln","Kreativ werden","Hilf mir, eine kreative Idee zu entwickeln."],
    ["⌘ Code schreiben","Programmieren lernen","Schreibe ein kleines Programm und erkläre den Code."],
    ["◈ Projekt planen","Schritt für Schritt","Hilf mir, ein Projekt zu planen."]
  ];

  items.forEach(([title,sub,value]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "suggestion";
    button.append(title);
    const span = document.createElement("span");
    span.textContent = sub;
    button.append(span);
    button.addEventListener("click", () => {
      promptInput.value = value;
      resizePrompt();
      promptInput.focus();
    });
    suggestions.append(button);
  });

  wrap.append(planet,heading,description,suggestions);
  messages.append(wrap);
}

function renderMessages() {
  messages.replaceChildren();
  const chat = activeChat();

  if (!chat || !chat.messages.length) {
    lastAnswer = "";
    renderWelcome();
    return;
  }

  chat.messages.forEach(message => messages.append(makeMessage(message)));
  const last = [...chat.messages].reverse().find(m => m.role === "assistant");
  lastAnswer = last ? last.content : "";
