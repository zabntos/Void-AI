
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090611">
<title>Void AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --bg:#080610;--panel:#110d1c;--panel2:#191128;
 --purple:#994cff;--violet:#c18aff;--text:#f7f1ff;
 --muted:#a69ab9;--border:#352447;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,Arial,sans-serif;min-height:100vh
}
button,input,textarea{font:inherit}
button{cursor:pointer;transition:.2s}
button:hover{filter:brightness(1.17)}
button:disabled{opacity:.5;cursor:wait}
.hidden{display:none!important}
body:before{
 content:"";position:fixed;inset:-35%;pointer-events:none;z-index:-1;
 background:
 radial-gradient(ellipse at 15% 20%,#7123bb32,transparent 36%),
 radial-gradient(ellipse at 80% 75%,#3724b52a,transparent 38%),
 radial-gradient(ellipse at 70% 10%,#9e39a31c,transparent 30%);
 animation:glow 14s ease-in-out infinite alternate
}
@keyframes glow{to{transform:translate(3%,2%) scale(1.08)}}
button:focus-visible,input:focus-visible,textarea:focus-visible{
 outline:2px solid var(--violet);outline-offset:2px
}
.brand{font-size:25px;font-weight:900;letter-spacing:2px}
.brand span{color:var(--violet);text-shadow:0 0 22px #a052ff80}
.small{font-size:12px;color:var(--muted)}
#auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth-card{
 width:100%;max-width:430px;padding:30px;
 background:#120d1deF;border:1px solid #7544a16b;
 border-radius:25px;box-shadow:0 0 90px #8c39e51c,0 20px 70px #0008;
 backdrop-filter:blur(20px)
}
.auth-card .brand{font-size:32px}
.tagline{color:var(--muted);margin:10px 0 28px}
.field{margin:16px 0}
label{display:block;color:#d6c7e9;font-size:13px;margin-bottom:8px}
input,textarea{
 width:100%;color:white;background:#0a0712;
 border:1px solid #423151;border-radius:12px;padding:14px
}
input:focus,textarea:focus{border-color:var(--violet);outline:none}
.primary{
 background:linear-gradient(110deg,#7135cb,#a24ff0);
 color:white;border:1px solid #b783ff44;border-radius:12px;
 padding:13px;font-weight:750;box-shadow:0 0 22px #853be52a
}
.full{width:100%;margin-top:8px}
.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
.linkbtn{background:none;border:0;color:#c49aff;text-decoration:underline}
#authStatus{font-size:13px;color:#e2caff;line-height:1.5}
#app{height:100dvh;display:flex;flex-direction:column}
header{
 height:68px;flex-shrink:0;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;
 background:#100b1be8;border-bottom:1px solid var(--border);
 backdrop-filter:blur(16px)
}
.head-actions{display:flex;gap:9px;align-items:center}
.ghost{
 border:1px solid var(--border);background:#1b1427;color:#e7d8ff;
 border-radius:10px;padding:10px 12px
}
#layout{display:flex;flex:1;min-height:0}
aside{
 width:250px;flex-shrink:0;padding:15px;
 background:#100b1bd9;border-right:1px solid var(--border);
 display:flex;flex-direction:column;gap:12px
}
#newChat{width:100%}
.side-title{font-size:11px;letter-spacing:1.7px;color:#9485a8;margin:8px 0 0}
#history{overflow:auto;display:flex;flex-direction:column;gap:7px}
.history-item{
 text-align:left;padding:11px;background:#171020;color:#ded1ee;
 border:1px solid transparent;border-radius:10px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.history-item.active{border-color:#8b52c9;background:#211432}
.history-item small{display:block;color:#9585aa;margin-top:5px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#messages{
 flex:1;overflow:auto;padding:26px 18px;
 display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth
}
.welcome{margin:auto;text-align:center;max-width:540px;padding:20px}
.orb{
 width:90px;height:90px;border-radius:50%;margin:0 auto 26px;
 background:radial-gradient(circle at 30% 25%,#f1dfff,#b16cff 22%,#7534ce 47%,#211034 76%);
 box-shadow:0 0 20px #a85aff9c,0 0 70px #772bd85c,inset -10px -12px 25px #170b30;
 animation:float 4s ease-in-out infinite
}
@keyframes float{50%{transform:translateY(-7px);box-shadow:0 0 35px #a85affbb,0 0 90px #772bd879}}
.welcome h1{font-size:clamp(27px,4vw,42px);margin:0 0 12px}
.gradient-text{background:linear-gradient(90deg,#fff,#c7a1ff,#a35bff);background-clip:text;color:transparent}
.welcome p{color:var(--muted);line-height:1.7}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.suggestion{background:#1a1325;color:#dfc8ff;border:1px solid #46305c;padding:10px 12px;border-radius:12px;font-size:12px}
.message{width:100%;max-width:820px;margin:0 auto;line-height:1.75}
.who{font-size:11px;font-weight:bold;letter-spacing:1.4px;color:#bd8bff;margin-bottom:8px}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere}
.message.user .bubble{background:#20152f;border:1px solid #443057;border-radius:15px;padding:14px 16px}
.message.assistant .bubble{padding:2px 1px}
.message-tools{display:flex;gap:8px;margin-top:10px}
.toolbtn{background:#191223;border:1px solid #332442;color:#cdb6eb;padding:7px 10px;border-radius:8px;font-size:12px}
#composer{padding:13px 18px 16px;border-top:1px solid #2c203b;background:#0c0915eF}
.composer-inner{
 display:flex;align-items:end;gap:9px;max-width:820px;margin:auto;
 padding:8px;background:#171020;border:1px solid #463155;
 border-radius:18px;box-shadow:0 0 30px #8136c61b
}
#prompt{resize:none;min-height:46px;max-height:150px;border:0;background:transparent;padding:12px;flex:1;line-height:1.5}
#prompt:focus{outline:none}
.round{
 width:44px;height:44px;flex-shrink:0;border-radius:12px;
 border:1px solid #483458;background:#211630;color:#e3ceff;font-size:18px
}
#send{background:linear-gradient(135deg,#7d38d2,#ae5bff);color:white;border:0;font-size:23px}
#voice.listening{background:#bd3159;color:white;box-shadow:0 0 20px #e13a6a77}
#voice.speaking{background:#6338a1}
#status{max-width:820px;margin:8px auto 0;min-height:18px;color:#c7b2e3;font-size:12px}
.footer{text-align:center;color:#82758e;font-size:10px;margin-top:9px}
@media(max-width:650px){
 header{padding:0 11px;height:60px}
 header .brand{font-size:21px}
 #userLabel{display:none}
 aside{width:61px;padding:9px 5px}
 aside .side-label{display:none}
 aside .brand{font-size:0}
 aside .brand:after{content:"V";font-size:23px;color:#c18aff}
 aside .primary{font-size:19px;padding:12px 2px}
 .history-item{font-size:0;text-align:center;padding:11px 0}
 .history-item:after{content:"•";font-size:20px}
 .history-item small{display:none}
 #messages{padding:20px 13px}
 #composer{padding:10px 9px 12px}
 .round{width:40px;height:42px}
 .auth-card{padding:23px}
}
</style>
</head>
<body>
<section id="auth">
 <div class="auth-card">
  <div class="brand">VOID <span>AI</span></div>
  <p class="tagline">A smarter space for your ideas.</p>
  <form id="authForm">
   <div class="field hidden" id="nameField">
    <label for="name">Your name</label>
    <input id="name" autocomplete="name" placeholder="Your name">
   </div>
   <div class="field">
    <label for="email">Email address</label>
    <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
   </div>
   <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="At least 6 characters">
   </div>
   <div class="field hidden" id="confirmField">
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" minlength="6" autocomplete="new-password">
   </div>
   <button class="primary full" id="authSubmit">Log in</button>
  </form>
  <div class="switch"><span id="switchText">New to Void AI?</span> <button class="linkbtn" id="switchMode" type="button">Create account</button></div>
  <p id="authStatus" role="status"></p>
 </div>
</section>

<section id="app" class="hidden">
 <header>
  <div class="brand">VOID <span>AI</span></div>
  <div class="head-actions">
   <span id="userLabel" class="small"></span>
   <button class="ghost" id="logout">Log out</button>
  </div>
 </header>
 <div id="layout">
  <aside>
   <div class="brand side-label">VOID <span>AI</span></div>
   <button id="newChat" class="primary">＋ <span class="side-label">New chat</span></button>
   <div class="side-title">YOUR HISTORY</div>
   <div id="history"></div>
   <div style="margin-top:auto" class="small side-label">Memory is based on saved chats on this device.</div>
  </aside>
  <main id="main">
   <div id="messages"></div>
   <div id="composer">
    <div class="composer-inner">
     <textarea id="prompt" rows="1" aria-label="Message Void AI" placeholder="Ask Void AI anything..."></textarea>
     <button id="voice" class="round" title="Start voice input" aria-label="Start voice input">🎙</button>
     <button id="send" class="round" title="Send message" aria-label="Send message">↑</button>
    </div>
    <div id="status" role="status"></div>
    <div class="footer">Void AI can make mistakes. Check important information.</div>
   </div>
  </main>
 </div>
</section>

<script>
/* ===== CONFIGURATION ===== */
const SUPABASE_URL="https://onewdrztvuffzxdnqmvi.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_X74KchzYmRvLdl_wb0ISkQ_-PNOnJAA";
const AI_ENDPOINT="https://void-ai-api.cguerpinar.workers.dev/";
/* ========================= */
const $=id=>document.getElementById(id);
let db=null,user=null,chats=[],activeId=null,registering=false,sending=false;
let recognition=null,listening=false,speaking=false;

if(window.supabase){
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
}
function authStatus(t){$("authStatus").textContent=t}
function status(t){$("status").textContent=t}
function setMode(create){
 registering=create;
 $("nameField").classList.toggle("hidden",!create);
 $("confirmField").classList.toggle("hidden",!create);
 $("name").required=create;
 $("confirm").required=create;
 $("authSubmit").textContent=create?"Create account":"Log in";
 $("switchText").textContent=create?"Already have an account?":"New to Void AI?";
 $("switchMode").textContent=create?"Log in":"Create account";
 authStatus("");
}
$("switchMode").onclick=()=>setMode(!registering);

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!db){authStatus("Supabase did not load. Check your internet.");return}
 const email=$("email").value.trim(),password=$("password").value;
 if(registering&&password!==$("confirm").value){authStatus("Passwords do not match.");return}
 $("authSubmit").disabled=true;
 authStatus(registering?"Creating account...":"Logging in...");
 try{
  if(registering){
   const {data,error}=await db.auth.signUp({
    email,password,options:{data:{display_name:$("name").value.trim()}}
   });
   if(error)throw error;
   if(data.session)await enterApp(data.session.user);
   else{authStatus("Account created. Check email confirmation if enabled, then log in.");setMode(false)}
  }else{
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error)throw error;
   await enterApp(data.user);
  }
 }catch(err){authStatus(err.message||"Login failed.")}
 finally{$("authSubmit").disabled=false}
});

function key(){return user?"void_ai_v3_"+user.id:""}
async function enterApp(u){
 user=u;
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("userLabel").textContent=u.user_metadata?.display_name||u.email||"Signed in";
 loadChats();
}
function loadChats(){
 try{
  const saved=JSON.parse(localStorage.getItem(key())||"[]");
  chats=Array.isArray(saved)?saved:[];
 }catch{chats=[]}
 chats=chats.filter(c=>c&&c.id&&Array.isArray(c.messages));
 if(!chats.length)createChat();
 else{activeId=chats[0].id;renderHistory();renderChat()}
}
function save(){
 if(!user)return;
 try{localStorage.setItem(key(),JSON.stringify(chats))}
 catch{status("Storage full. Older chats may not save.")}
}
function active(){return chats.find(c=>c.id===activeId)}
function createChat(){
 const c={id:crypto.randomUUID(),title:"New chat",messages:[],created:Date.now()};
 chats.unshift(c);activeId=c.id;save();renderHistory();renderChat();$("prompt").focus()
}
$("newChat").onclick=createChat;
function renderHistory(){
 const h=$("history");h.innerHTML="";
 chats.forEach(c=>{
  const b=document.createElement("button");
  b.className="history-item"+(c.id===activeId?" active":"");
  b.textContent=c.title||"New chat";b.title=c.title||"New chat";
  const date=document.createElement("small");
  date.textContent=c.messages.length+" messages";
  b.appendChild(date);
  b.onclick=()=>{activeId=c.id;renderHistory();renderChat()};
  h.appendChild(b);
 });
}
function addMessage(role,content){
 const row=document.createElement("div");row.className="message "+role;
 const who=document.createElement("div");who.className="who";
 who.textContent=role==="user"?"YOU":"VOID AI";
 const bubble=document.createElement("div");bubble.className="bubble";
 bubble.textContent=content;
 row.append(who,bubble);
 if(role==="assistant"){
  const tools=document.createElement("div");tools.className="message-tools";
  const copy=document.createElement("button");copy.className="toolbtn";copy.textContent="Copy";
  copy.onclick=async()=>{try{await navigator.clipboard.writeText(content);status("Copied reply.")}catch{status("Copy unavailable in this browser.")}};
  const read=document.createElement("button");read.className="toolbtn";read.textContent="Read aloud";
  read.onclick=()=>speak(content);
  tools.append(copy,read);row.appendChild(tools);
 }
 $("messages").appendChild(row);
}
function renderChat(){
 const box=$("messages");box.innerHTML="";
 const c=active();
 if(!c||!c.messages.length){
  const w=document.createElement("div");w.className="welcome";
  w.innerHTML='<div class="orb"></div><h1 class="gradient-text">Think beyond the void</h1><p>Your ideas, questions and projects start here.</p>';
  const suggestions=document.createElement("div");suggestions.className="suggestions";
  ["Explain something difficult","Help me write code","Give me creative ideas"].forEach(t=>{
   const b=document.createElement("button");b.className="suggestion";b.textContent=t;
   b.onclick=()=>{$("prompt").value=t;$("prompt").focus()};
   suggestions.appendChild(b)
  });
  w.appendChild(suggestions);box.appendChild(w);return;
 }
 c.messages.forEach(m=>addMessage(m.role,m.content));
 box.scrollTop=box.scrollHeight;
}

/* Use recent previous turns as context for the existing AI endpoint. */
function makeContext(c){
 const prior=c.messages.slice(-16).map(m=>
  (m.role==="user"?"USER":"ASSISTANT")+": "+m.content
 ).join("\n\n");
 const otherChats=chats.filter(x=>x.id!==c.id&&x.messages.length)
  .slice(0,5).map(x=>{
   const last=x.messages.slice(-4).map(m=>
    (m.role==="user"?"User":"Void AI")+": "+m.content
   ).join("\n");
   return "Past conversation titled '"+x.title+"':\n"+last;
  }).join("\n\n");
 return "You are Void AI, a helpful, thoughtful assistant. Answer accurately, explain reasoning clearly, and admit uncertainty when needed. Use relevant context from earlier messages. Do not claim you remember information that is not included here.\n\n"+
  (otherChats?"RELEVANT SAVED CONVERSATIONS:\n"+otherChats+"\n\n":"")+
  (prior?"CURRENT CONVERSATION SO FAR:\n"+prior+"\n\n":"");
}
async function send(){
 if(sending||!user)return;
 const text=$("prompt").value.trim();if(!text)return;
 const c=active();if(!c)return;
 sending=true;$("send").disabled=true;$("prompt").disabled=true;
 $("prompt").value="";
 c.messages.push({role:"user",content:text});
 if(c.title==="New chat")c.title=text.slice(0,42);
 save();renderHistory();renderChat();status("Void AI is thinking...");
 try{
  const response=await fetch(AI_ENDPOINT,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:makeContext(c)+"LATEST USER MESSAGE:\n"+text})
  });
  if(!response.ok)throw Error("AI server error "+response.status);
  const data=await response.json();
  const reply=data.reply||data.response||data.message;
  if(typeof reply!=="string"||!reply.trim())throw Error("Empty AI response");
  c.messages.push({role:"assistant",content:reply.trim()});
  status("");
 }catch(err){
  c.messages.push({role:"assistant",content:"I couldn't load a response. Please try again. ("+err.message+")"});
  status("Connection error. Check that your AI Worker is online.");
 }
 finally{
  sending=false;$("send").disabled=false;$("prompt").disabled=false;
  save();renderHistory();renderChat();$("prompt").focus()
 }
}
$("send").onclick=send;
$("prompt").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}
});
$("prompt").addEventListener("input",()=>{
 $("prompt").style.height="auto";
 $("prompt").style.height=Math.min($("prompt").scrollHeight,150)+"px";
});

/* Voice input: browser speech recognition support varies by device. */
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 recognition=new SpeechRecognition();
 recognition.lang="en-US";recognition.interimResults=true;
 recognition.continuous=false;
 recognition.onstart=()=>{listening=true;$("voice").classList.add("listening");$("voice").textContent="■";status("Listening... speak now")};
 recognition.onresult=e=>{
  let transcript="";
  for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
  $("prompt").value=transcript;
 };
 recognition.onerror=e=>status("Voice input: "+e.error);
 recognition.onend=()=>{listening=false;$("voice").classList.remove("listening");$("voice").textContent="🎙";if($("status").textContent==="Listening... speak now")status("")};
}else{
 $("voice").title="Voice input is not supported in this browser";
}
$("voice").onclick=()=>{
 if(!recognition){status("Voice input is unavailable here. Try Chrome and allow microphone access.");return}
 if(listening)recognition.stop();
 else{try{recognition.start()}catch{status("Allow microphone access and try again.")}}
};
function speak(text){
 if(!("speechSynthesis" in window)){status("Speech output is not supported.");return}
 if(speaking){speechSynthesis.cancel();speaking=false;$("voice").classList.remove("speaking");return}
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="en-US";
 utterance.onstart=()=>{speaking=true;$("voice").classList.add("speaking")};
 utterance.onend=utterance.onerror=()=>{speaking=false;$("voice").classList.remove("speaking")};
 speechSynthesis.speak(utterance);
}
$("logout").onclick=async()=>{
 if(db)await db.auth.signOut();
 user=null;chats=[];activeId=null;
 $("app").classList.add("hidden");$("auth").classList.remove("hidden");
 $("messages").innerHTML="";$("history").innerHTML="";setMode(false);
};
function setMode(create){
 registering=create;
 $("nameField").classList.toggle("hidden",!create);
 $("confirmField").classList.toggle("hidden",!create);
 $("name").required=create;$("confirm").required=create;
 $("authSubmit").textContent=create?"Create account":"Log in";
 $("switchText").textContent=create?"Already have an account?":"New to Void AI?";
 $("switchMode").textContent=create?"Log in":"Create account";
 authStatus("");
}
$("switchMode").onclick=()=>setMode(!registering);
if(db){
 db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"&&user){
   user=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");
  }
 });
 db.auth.getSession().then(({data,error})=>{
  if(error)authStatus(error.message);
  else if(data.session?.user)enterApp(data.session.user);
 }).catch(()=>authStatus("Could not restore login."));
}else authStatus("Supabase could not load. Check your connection.");
setMode(false);
</script>
</body>
</html>
